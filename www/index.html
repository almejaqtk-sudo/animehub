<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14121f">
<title>AnimeHub</title>
<style>
:root{--bg:#14121f;--card:#1e1b2e;--card2:#2a2640;--tx:#efeaf7;--mut:#8f89a8;--ac:#ff7a9c;--ok:#7be0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h3{margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo span{color:var(--ac)}
#modSel{margin-left:auto;background:var(--card);border:1px solid #ffffff14;border-radius:999px;padding:8px 12px;font-size:13px;max-width:58%}
#main{flex:1;overflow-y:auto;padding:6px 14px 96px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#100e1a;border-top:1px solid #ffffff10;padding-bottom:env(safe-area-inset-bottom);z-index:5}
#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button i{font-style:normal;font-size:20px;line-height:1}
#tabs button.on{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;align-self:start}
.poster{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);position:relative}
.poster img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--card2)}
.ct{font-size:12.5px;margin-top:6px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:11px;color:var(--mut);margin-top:2px}
.sk{aspect-ratio:2/3;border-radius:10px;background:var(--card);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.empty{color:var(--mut);text-align:center;padding:36px 12px;line-height:1.5}
.btn{display:block;width:100%;background:var(--ac);color:#1b0a10;font-weight:700;border:0;border-radius:12px;padding:13px;margin:10px 0}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.more{background:var(--card2);color:var(--tx);margin:18px 0}
.sm{background:var(--card2);border:0;border-radius:9px;padding:7px 11px;font-size:12px}
.sm.del{color:var(--ac)}
input,textarea,select{background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:12px;width:100%}
textarea{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sbar{display:flex;gap:8px;margin:6px 0 16px}
.sbar button{background:var(--ac);color:#1b0a10;font-weight:700;border:0;border-radius:12px;padding:0 16px}
main h3,#detail h3{font-size:15px;margin:22px 0 10px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.mrow>div{flex:1;min-width:0}
.mrow small{display:block;color:var(--mut);margin-top:2px;font-size:11px}
.tag{font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:3px 8px}
.note{color:var(--mut);font-size:12px;line-height:1.5}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:24px;line-height:1}
.dhead{height:250px;background-size:cover;background-position:center;position:relative}
.dhead::after{content:"";position:absolute;inset:0;background:linear-gradient(#14121f55,var(--bg))}
.dbody{position:relative;z-index:2;margin-top:-100px;padding:0 16px 48px}
.drow{display:flex;gap:14px;align-items:flex-end}
.dcover{width:108px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--card)}
.drow h1{font-size:19px;line-height:1.25}
.meta{color:var(--mut);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chips span,.chips button{background:var(--card2);border:0;border-radius:999px;padding:5px 11px;font-size:12px}
.chips button.on{background:var(--ac);color:#1b0a10;font-weight:700}
.acts{display:flex;gap:8px}
.acts .btn{margin:12px 0 4px}
.desc{white-space:pre-line;line-height:1.55;font-size:14px;color:#cfc8e2;max-height:6.2em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.eh{display:flex;align-items:center;justify-content:space-between}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:12px;padding:10px 12px;color:inherit;text-align:left;position:relative;overflow:hidden;width:100%}
.ep .n{min-width:34px;height:34px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px}
.ep .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.ep .chk{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.ep.viewed{opacity:.62}
.ep.viewed .n{background:var(--ok);color:#08210f}
.ep.viewed .chk{background:var(--ok);border-color:var(--ok);color:#08210f}
.sh-row .tag{margin-left:auto;flex:none;font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--ac)}
.sh-row .tag.lat{color:var(--ok)}
.sh-row .tag .fl{font-size:17px;line-height:1;vertical-align:-2px}
.sec{margin:16px 4px 8px;font-size:19px;font-weight:700}
.cn{padding:0 10px 10px;color:var(--ac);font-weight:700;font-size:13px;text-align:left}
.days{display:flex;overflow-x:auto;gap:4px;border-bottom:1px solid var(--card2);margin:6px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;background:none;border:0;color:var(--mut);font-weight:700;letter-spacing:1px;padding:12px 14px;border-bottom:3px solid transparent}
.days .cnt{font-size:11px;background:var(--card2);color:var(--tx);border-radius:99px;padding:2px 7px;margin-left:5px;letter-spacing:0}
.days button.on{color:var(--ac);border-bottom-color:var(--ac)}
.dhead .dhimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#player{z-index:20;background:#000;overflow:hidden;--pl:#b9c6ff}
#stage{position:absolute;inset:0;background:#000;user-select:none;touch-action:none}
#vbox,#vbox video,#vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#vbox video{object-fit:contain}
#ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#000c,#0000 30%,#0000 55%,#000d);opacity:0;pointer-events:none;transition:opacity .2s;color:var(--pl);padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#stage.show #ctl{opacity:1;pointer-events:auto}
#ctl button{background:none;border:0;color:var(--pl)}
.ctop{display:flex;align-items:flex-start;gap:12px}
#pBack{font-size:28px;line-height:1;color:#fff!important;padding:2px 8px}
#pTitle{flex:1;min-width:0;text-align:center;line-height:1.3;color:#e6e9f5}
#pT1{display:block;font-size:17px;font-weight:700}
#pT2{display:block;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1.5px solid #ffffff44!important;border-radius:999px;padding:11px 18px!important;font-size:14px;font-weight:700;background:#0005!important}
.side{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;pointer-events:none}
.side.L{left:max(14px,env(safe-area-inset-left))}
.side.R{right:max(14px,env(safe-area-inset-right))}
.vbar{width:14px;height:34vh;background:#ffffff26;border-radius:8px;overflow:hidden;position:relative}
.vbar i{position:absolute;left:0;right:0;bottom:0;background:var(--pl);border-radius:8px}
.cmid{display:flex;justify-content:center;align-items:center;gap:clamp(24px,10vw,90px)}
.cmid button{font-size:20px;font-weight:700;padding:10px}
#pPlay{width:84px;height:84px;display:grid;place-items:center;padding:0}
#pPlay svg{width:68px;height:68px}
.cbot{display:flex;flex-direction:column;gap:4px}
.seek{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
#pSeek{flex:1;height:26px;background:none;border:0;padding:0;accent-color:var(--pl)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tools button{font-size:14px;font-weight:700;padding:8px 6px}
#stage.novid #ctl{opacity:1;pointer-events:none;background:none}
#stage.novid .side,#stage.novid .cmid,#stage.novid .seek,#stage.novid #pLock,#stage.novid #pSpd,#stage.novid #pSkip,#stage.novid #pTitle{display:none}
#stage.novid #pBack{pointer-events:auto;background:#0008!important;border-radius:50%;width:42px;height:42px;padding:0}
#stage.novid .cbot{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
#stage.novid .tools{pointer-events:auto;gap:8px}
#stage.novid .tools button{background:#0008!important;border-radius:999px;padding:8px 12px}
#pUnlock{position:absolute;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);background:#000a;border:0;color:#fff;border-radius:50%;width:52px;height:52px;font-size:22px}
#pMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:14px;color:#ddd;pointer-events:none}
#hud{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:#000b;color:#fff;font-size:15px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
#hud.on{opacity:1}
#pReveal{display:none;position:absolute;top:0;left:0;right:0;height:44px;background:none;border:0;padding:0}
#stage.novid.clean #pReveal{display:block}
#stage.novid.clean #ctl{opacity:0}
#stage.novid.clean #pBack,#stage.novid.clean .tools{pointer-events:none}
#stage{outline:none}
.pill{text-transform:uppercase}
#pRw svg,#pFw svg{width:60px;height:60px}
.sico{flex:none;background:none;border:0;padding:6px 10px 6px 4px;color:var(--tx);display:grid;place-items:center}
.frow{display:flex;gap:8px;overflow-x:auto;margin:-6px 0 14px;padding-bottom:4px}
.fchip{flex:none;background:none;border:1.5px solid #ffffff2e;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.fchip.on{border-color:var(--ac);color:var(--ac)}
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:#0009}
.sh-box{position:relative;width:min(94vw,460px);max-height:84vh;background:var(--card);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(orientation:landscape){#sheet{align-items:center}.sh-box{border-radius:18px;max-height:90vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:16px}
#shX{background:none;border:0;font-size:20px;padding:4px 8px}
#shL{overflow-y:auto;padding:0 6px}
.sh-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:13px 12px;font-size:15px;text-align:left}
.sh-row .rb{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:none}
.sh-row.on .rb{border-color:var(--ac);background:radial-gradient(var(--ac) 45%,transparent 50%)}
#shF{display:flex;gap:8px;padding:10px 12px}
#shF button{flex:1;margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="top"><div class="logo">Anime<span>Hub</span></div><select id="modSel" aria-label="Módulo activo"></select></header>
  <main id="main"></main>
  <nav id="tabs">
    <button data-t="home"><i>⌂</i>Inicio</button>
    <button data-t="search"><i>⌕</i>Buscar</button>
    <button data-t="favs"><i>★</i>Mi lista</button>
    <button data-t="mods"><i>⚙</i>Módulos</button>
  </nav>
</div>

<section id="detail" class="ov" hidden></section>

<section id="player" class="ov" hidden>
  <div id="stage" tabindex="-1">
    <div id="vbox"></div>
    <div id="ctl">
      <div class="ctop">
        <button id="pBack" aria-label="Volver">←</button>
        <div id="pTitle"><span id="pT1"></span><span id="pT2"></span></div>
        <button id="pSkip" class="pill">Omitir opening</button>
      </div>
      <div class="side L"><div class="vbar"><i id="bBri"></i></div><span>☀</span></div>
      <div class="side R"><div class="vbar"><i id="bVol"></i></div><span>🔊</span></div>
      <div class="cmid"><button id="pRw" aria-label="Atrasar 10 segundos"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="16.2" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg></button><button id="pPlay" aria-label="Reproducir o pausar"></button><button id="pFw" aria-label="Adelantar 10 segundos"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M18 13c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2z"/><text x="12" y="16.2" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg></button></div>
      <div class="cbot">
        <div class="seek"><span id="pCur">0:00</span><input type="range" id="pSeek" min="0" max="1000" value="0"><span id="pDur">0:00</span></div>
        <div class="tools"><button id="pFit">Escala: Ajustar</button><button id="pLock">Bloquear</button><button id="pEps">Episodios</button><button id="pQ">Servidor</button><button id="pSpd">1x</button></div>
      </div>
    </div>
    <button id="pUnlock" hidden aria-label="Desbloquear">🔓</button>
    <div id="pMsg"></div>
    <div id="hud"></div>
    <button id="pReveal" aria-label="Mostrar opciones"></button>
  </div>
</section>

<div id="sheet" hidden>
  <div class="sh-bg"></div>
  <div class="sh-box">
    <div class="sh-h"><b id="shT"></b><button id="shX" aria-label="Cerrar">✕</button></div>
    <div id="shL"></div>
    <div id="shF"><button class="btn ghost" id="shClear">Limpiar</button><button class="btn" id="shApply">Aplicar</button></div>
  </div>
</div>

<div id="toast"></div>

<script src="hls.min.js" onerror="var h=document.createElement('script');h.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';document.head.appendChild(h)"></script>
<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>new DOMParser().parseFromString(String(h||'').replace(/<br\s*\/?>/gi,'\n'),'text/html').body.textContent.trim();
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=s=>{if(!isFinite(s)||s<0)return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
let toastT;
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||2600)}

/* ============ API que reciben los módulos ============ */
const httpErr=r=>{const e=new Error('HTTP '+r.status);e.status=r.status;return e};
const api={
  async text(url,opt){const r=await fetch(url,opt);if(!r.ok)throw httpErr(r);return r.text()},
  async json(url,opt){const r=await fetch(url,opt);if(!r.ok)throw httpErr(r);return r.json()},
  async html(url,opt){return new DOMParser().parseFromString(await api.text(url,opt),'text/html')},
  abs(rel,base){try{return new URL(rel,base).href}catch(e){return rel}}
};

/* ============ módulo principal incluido: AnimeAV1 ============ */
const BUILTIN=(function(){
const BASE_URL = 'https://animeav1.com';

/* ---------- FILTROS (los mismos que tiene la web en /catalogo) ---------- */
// Parámetro de URL que usa la web para cada filtro: /catalogo?genre=accion&status=emision&category=tv-anime&page=2
const FILTER_PARAM = { genre: 'genre', type: 'category', status: 'status' };

const slugify = (s) =>
  s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[()]/g, '').trim().replace(/\s+/g, '-');

// Géneros tal como los muestra la web. El valor (v) es el "slug" de la URL.
// Si algún género no devuelve resultados, corrige aquí su slug: { v: 'slug-real', t: 'Nombre' }
const GENRE_NAMES = [
  'Acción', 'Antropomórfico', 'Artes Marciales', 'Aventura', 'Carreras', 'Ciencia Ficción', 'Comedia',
  'Deportes', 'Detectives', 'Drama', 'Elenco adulto', 'Escolares', 'Espacial', 'Fantasía', 'Gastronomía',
  'Gore', 'Harem', 'Histórico', 'Idols (Hombre)', 'Idols (Mujer)', 'Isekai', 'Josei', 'Juegos',
  'Mahou Shoujo', 'Mecha', 'Militar', 'Misterio', 'Mitología', 'Música', 'Parodia', 'Psicológico',
  'Recuentos de la vida', 'Romance', 'Samurai', 'Seinen', 'Shoujo', 'Shounen', 'Sobrenatural',
  'Superpoderes', 'Suspenso', 'Terror', 'Vampiros', 'Yaoi', 'Yuri'
];

const FILTERS = [
  { id: 'genre', label: 'Género', multi: false, options: GENRE_NAMES.map((n) => ({ v: slugify(n), t: n })) },
  {
    id: 'type', label: 'Tipo', multi: false,
    options: [
      { v: 'tv-anime', t: 'TV Anime' }, { v: 'pelicula', t: 'Película' }, { v: 'ova', t: 'OVA' },
      { v: 'ona', t: 'ONA' }, { v: 'especial', t: 'Especial' }
    ]
  },
  {
    id: 'status', label: 'Estado', multi: false,
    options: [
      { v: 'emision', t: 'En emisión' }, { v: 'finalizado', t: 'Finalizado' }, { v: 'proximamente', t: 'Próximamente' }
    ]
  }
];

const isNotFound = (e) => !!e && (e.status === 404 || /\b404\b/.test(String(e.message || '')));

/* ---------- SERVIDORES ---------- */
const FAST_SERVERS = [
  { priority: 0, name: 'HLS', match: /zilla-networks/i, type: 'embed' },
  { priority: 1, name: 'Streamwish', match: /(streamwish|wish|hglink|swiftplayers|alions|filelions|vidhide)/i, type: 'embed' },
  { priority: 2, name: 'Mp4upload', match: /mp4upload/i, type: 'embed' },
  { priority: 3, name: 'Okru', match: /(ok\.ru|od\.sdk|okcdn)/i, type: 'embed' },
  { priority: 4, name: 'YourUpload', match: /yourupload/i, type: 'embed' },
  { priority: 5, name: 'Filemoon', match: /(filemoon|moonplayer|kerapoxy)/i, type: 'embed' },
  { priority: 6, name: 'Streamtape', match: /(streamtape|strtape|strcloud)/i, type: 'embed' },
  { priority: 7, name: 'Doodstream', match: /(dood|ds2play|d0000d|do7go)/i, type: 'embed' },
  { priority: 8, name: 'Mega', match: /mega\.nz/i, type: 'embed' }
];

const BLOCKED_SERVERS = [
  /(fembed|feurl|fe\.|ncdn|streamango|openload|rapidvideo|verystream|clipwatching|jetload|mixdrop|upstream|voe|uqload|sbplay|sbembed|streamsb|embedrise|animeav1\.com\/(assets|static|img|js|css))/i
];

function classifyFastServer(rawUrl) {
  const url = String(rawUrl || '').trim();
  if (!url || !/^https?:\/\//i.test(url)) return null;

  for (const blocked of BLOCKED_SERVERS) {
    if (blocked.test(url)) return null;
  }

  for (const srv of FAST_SERVERS) {
    if (srv.match.test(url)) {
      return {
        priority: srv.priority,
        label: srv.name,
        url,
        type: srv.type
      };
    }
  }

  if (/\.m3u8(\?|$)/i.test(url)) {
    return { priority: 0, label: 'HLS Rápido', url, type: 'hls' };
  }

  if (/\.mp4(\?|$)/i.test(url) && !/(thumb|poster|preview|cover|ads|promo|sample)/i.test(url)) {
    return { priority: 1, label: 'MP4 Rápido', url, type: 'mp4' };
  }

  return null;
}


// Texto de contexto (atributos, clases y texto corto del elemento y sus padres) para que la app detecte "sub" / "latino" / "español"
function ctxLang(el) {
  let t = '';
  let n = el;
  for (let i = 0; i < 4 && n && n.getAttribute; i++) {
    t += ' ' + ['data-lang', 'data-audio', 'data-language', 'data-idioma', 'aria-label', 'title']
      .map((a) => n.getAttribute(a) || '').join(' ');
    if (i < 2) {
      const own = (n.textContent || '').replace(/\s+/g, ' ').trim();
      if (own.length <= 40) t += ' ' + own;
    }
    n = n.parentElement;
  }
  return t;
}

function pickText(doc, selectors) {
  for (const sel of selectors) {
    const el = doc.querySelector(sel);
    if (el && el.textContent && el.textContent.trim()) {
      return el.textContent.trim();
    }
  }
  return '';
}

function pickAttr(doc, selectors, attr) {
  for (const sel of selectors) {
    const el = doc.querySelector(sel);
    const val = el ? el.getAttribute(attr) : '';
    if (val && val.trim()) {
      return val.trim();
    }
  }
  return '';
}

// Portada real: prueba los atributos "lazy" antes que src y descarta marcadores de posición
function imgUrl(img, baseUrl) {
  if (!img) return '';
  const bad = (u) => !u || /^data:/i.test(u) || /(placeholder|blank|loading|lazy\.|noimage|default)/i.test(u);
  const fromSet = (v) => String(v || '').trim().split(/\s+/)[0];
  const cand = ['data-src', 'data-lazy-src', 'data-original', 'data-lazy', 'data-thumb', 'data-poster']
    .map((a) => img.getAttribute(a) || '')
    .concat([fromSet(img.getAttribute('data-srcset')), img.getAttribute('src') || '', fromSet(img.getAttribute('srcset'))]);
  const raw = cand.find((u) => !bad(u)) || '';
  return raw ? api.abs(raw, baseUrl) : '';
}

function parseCardList(doc, baseUrl) {
  const cardSelectors = [
    'article',
    '.anime-card',
    '.grid a[href*="/anime/"]',
    'a[href*="/anime/"]'
  ];

  let cards = [];
  for (const sel of cardSelectors) {
    const found = Array.from(doc.querySelectorAll(sel));
    if (found.length > 0) {
      cards = found;
      break;
    }
  }

  const seen = new Set();
  const items = [];

  for (const card of cards) {
    const link = card.matches('a') ? card : card.querySelector('a[href*="/anime/"]') || card.querySelector('a');
    const href = link ? link.getAttribute('href') || '' : '';
    if (!href || href === '#' || href.startsWith('javascript:')) continue;

    const absUrl = api.abs(href, baseUrl);
    if (seen.has(absUrl)) continue;
    seen.add(absUrl);

    const img = card.querySelector('img');
    const cover = imgUrl(img, baseUrl);

    const title = (
      card.querySelector('h2, h3, h4, .title, .anime-title')?.textContent ||
      img?.getAttribute('alt') ||
      link?.getAttribute('title') ||
      link?.textContent ||
      ''
    ).trim();

    if (!title) continue;

    const sub = (
      card.querySelector('.type, .badge, .meta, .sub, span')?.textContent || ''
    ).trim();

    items.push({
      title,
      cover,
      url: absUrl,
      sub: sub && sub !== title ? sub : undefined
    });
  }

  return items;
}

function extractEpisodes(doc, htmlText, animeUrl) {
  const episodes = [];
  const seenUrls = new Set();
  const seenNumbers = new Set();

  const animeSlug = animeUrl
    .replace(/^https?:\/\/[^/]+/i, '')
    .replace(/\/+$/, '')
    .split('/')
    .pop() || '';

  const addEpisode = (number, title, epUrl) => {
    const num = Number(number);
    if (!Number.isFinite(num) || num <= 0) return;
    const cleanUrl = epUrl ? api.abs(epUrl, animeUrl) : `${animeUrl.replace(/\/+$/, '')}/episodio-${num}`;
    if (seenUrls.has(cleanUrl) && seenNumbers.has(num)) return;
    seenUrls.add(cleanUrl);
    seenNumbers.add(num);
    episodes.push({
      number: num,
      title: (title || `Episodio ${num}`).trim(),
      url: cleanUrl
    });
  };

  const allLinks = Array.from(doc.querySelectorAll('a[href]'));
  for (const a of allLinks) {
    const href = (a.getAttribute('href') || '').trim();
    if (!href || href === '#' || href.startsWith('javascript:')) continue;

    const text = (a.textContent || '').replace(/\s+/g, ' ').trim();
    const looksLikeEp =
      /\/(episodio|ep|ver|watch|capitulo|cap)[\/-]/i.test(href) ||
      /-(episodio|ep|capitulo|cap)-\d+/i.test(href) ||
      (animeSlug && href.includes(animeSlug) && /\/\d+\/?$/.test(href)) ||
      /^(episodio|ep\.?|cap\.?|capítulo)\s*\d+/i.test(text);

    if (!looksLikeEp) continue;

    const numMatch =
      href.match(/(?:episodio|ep|capitulo|cap)[-_\/](\d+(?:\.\d+)?)/i) ||
      href.match(/\/(\d+(?:\.\d+)?)\/?$/) ||
      text.match(/(?:episodio|ep\.?|cap\.?|capítulo)\s*(\d+(?:\.\d+)?)/i) ||
      text.match(/\b(\d+(?:\.\d+)?)\b/);

    if (numMatch) {
      addEpisode(
        numMatch[1],
        text || `Episodio ${numMatch[1]}`,
        href
      );
    }
  }

  const dataEls = Array.from(
    doc.querySelectorAll('[data-episode], [data-ep], [data-href], [data-url]')
  );
  for (const el of dataEls) {
    const epAttr = el.getAttribute('data-episode') || el.getAttribute('data-ep') || '';
    const hrefAttr = el.getAttribute('data-href') || el.getAttribute('data-url') || '';
    const txt = (el.textContent || '').replace(/\s+/g, ' ').trim();

    const numMatch =
      epAttr.match(/(\d+(?:\.\d+)?)/) ||
      hrefAttr.match(/(?:episodio|ep|cap)[-_\/](\d+(?:\.\d+)?)/i) ||
      txt.match(/(?:episodio|ep\.?|cap\.?)\s*(\d+(?:\.\d+)?)/i);

    if (numMatch) {
      addEpisode(
        numMatch[1],
        txt || `Episodio ${numMatch[1]}`,
        hrefAttr || undefined
      );
    }
  }

  if (episodes.length === 0 && htmlText) {
    const cleanHtml = htmlText.replace(/\\\//g, '/');
    const urlMatches = cleanHtml.match(/https?:\/\/[^\s"'<>]+\/(?:episodio|ep|ver|watch)[\/-][^\s"'<>]+/gi) || [];
    for (const u of urlMatches) {
      const m = u.match(/(?:episodio|ep|ver|watch)[-_\/](\d+(?:\.\d+)?)/i);
      if (m) {
        addEpisode(m[1], `Episodio ${m[1]}`, u);
      }
    }
  }

  if (episodes.length === 0) {
    const bodyText = doc.body ? doc.body.textContent || '' : '';
    const countMatch = bodyText.match(/(?:episodios?|capítulos?|capitulos?)\s*[:\-]?\s*(\d{1,4})\b/i);
    if (countMatch) {
      const total = Number(countMatch[1]);
      if (total > 0 && total <= 200) {
        for (let i = 1; i <= total; i++) {
          addEpisode(i, `Episodio ${i}`, `${animeUrl.replace(/\/+$/, '')}/episodio-${i}`);
        }
      }
    }
  }

  episodes.sort((a, b) => a.number - b.number);
  return episodes;
}

/* ---------- HORARIO SEMANAL (/horario) ---------- */
const WEEK = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
const WEEK_LABEL = { lunes: 'Lunes', martes: 'Martes', miercoles: 'Miércoles', jueves: 'Jueves', viernes: 'Viernes', sabado: 'Sábado', domingo: 'Domingo' };

function dayOf(text) {
  const n = String(text || '').replace(/\s+/g, ' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  if (!n || n.length > 20) return '';
  const m = n.match(/^(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/);
  return m ? m[1] : '';
}

function scheduleCard(a, baseUrl) {
  let u;
  try { u = new URL(api.abs(a.getAttribute('href') || '', baseUrl)); } catch (_) { return null; }
  if (!/^\/media\/[^/]+\/?$/.test(u.pathname)) return null; // solo fichas de anime, no episodios
  const box = a.closest('article, li') || a;
  const img = a.querySelector('img') || box.querySelector('img');
  const title = (
    a.querySelector('h2, h3, h4, .title')?.textContent ||
    box.querySelector('h2, h3, h4, .title')?.textContent ||
    img?.getAttribute('alt') ||
    a.getAttribute('title') ||
    a.textContent ||
    ''
  ).replace(/\s+/g, ' ').trim();
  if (!title) return null;
  const raw = img ? img.getAttribute('data-src') || img.getAttribute('src') || '' : '';
  return { title, cover: raw && !/^data:/i.test(raw) ? api.abs(raw, baseUrl) : '', url: u.href };
}

function parseSchedule(doc, baseUrl) {
  const byDay = {};
  const push = (day, item) => {
    if (!day || !item) return;
    const list = (byDay[day] = byDay[day] || []);
    if (!list.some((x) => x.url === item.url)) list.push(item);
  };
  const result = () =>
    WEEK.filter((d) => byDay[d] && byDay[d].length).map((d) => ({ day: WEEK_LABEL[d], items: byDay[d] }));

  // A) pestañas que apuntan a su panel (aria-controls, href="#id" o data-target)
  doc.querySelectorAll('[role="tab"], [data-day], [data-tab], a[href^="#"], button').forEach((tab) => {
    const day = dayOf(tab.textContent);
    if (!day) return;
    const id = (tab.getAttribute('aria-controls') || tab.getAttribute('data-target') || tab.getAttribute('href') || '').replace(/^#/, '');
    const panel = id ? doc.getElementById(id) : null;
    if (panel) panel.querySelectorAll('a[href*="/media/"]').forEach((a) => push(day, scheduleCard(a, baseUrl)));
  });
  if (Object.keys(byDay).length >= 2) return result();

  // B) encabezados de día seguidos de sus tarjetas, en orden de documento
  Object.keys(byDay).forEach((k) => delete byDay[k]);
  let current = '';
  doc.body.querySelectorAll('*').forEach((el) => {
    if (el.children.length === 0) {
      const d = dayOf(el.textContent);
      if (d) { current = d; return; }
    }
    if (current && el.matches('a[href*="/media/"]')) push(current, scheduleCard(el, baseUrl));
  });
  if (Object.keys(byDay).length >= 2) return result();

  // C) un contenedor con 7 paneles (lunes → domingo)
  Object.keys(byDay).forEach((k) => delete byDay[k]);
  for (const el of Array.from(doc.body.querySelectorAll('*'))) {
    if (el.children.length !== 7) continue;
    const kids = Array.from(el.children);
    if (kids.filter((k) => k.querySelector('a[href*="/media/"]')).length < 4) continue;
    kids.forEach((k, i) => k.querySelectorAll('a[href*="/media/"]').forEach((a) => push(WEEK[i], scheduleCard(a, baseUrl))));
    break;
  }
  return result();
}

/* ---------- HORARIO: lectura de JSON y descubrimiento de la API ---------- */
const JS_DAYS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];

// Decodifica el formato "devalue" que usa SvelteKit en /__data.json
function devalueDecode(arr) {
  const memo = new Map();
  const rev = (i) => {
    if (i === -1) return undefined;
    if (i === -2) return NaN;
    if (i === -3) return Infinity;
    if (i === -4) return -Infinity;
    if (i === -5) return -0;
    if (memo.has(i)) return memo.get(i);
    const v = arr[i];
    if (v === null || typeof v !== 'object') { memo.set(i, v); return v; }
    if (Array.isArray(v)) {
      if (typeof v[0] === 'string') {
        if (v[0] === 'Date') { memo.set(i, v[1]); return v[1]; }
        if (v[0] === 'BigInt') { const n = Number(v[1]); memo.set(i, n); return n; }
        if (v[0] === 'Set') { const s = []; memo.set(i, s); v.slice(1).forEach((x) => s.push(rev(x))); return s; }
        if (v[0] === 'Map' || v[0] === 'RegExp' || v[0] === 'Object') { memo.set(i, null); return null; }
      }
      const out = [];
      memo.set(i, out);
      v.forEach((x) => out.push(rev(x)));
      return out;
    }
    const obj = {};
    memo.set(i, obj);
    Object.keys(v).forEach((k) => { obj[k] = rev(v[k]); });
    return obj;
  };
  return arr.length ? rev(0) : null;
}

function findAnime(o, depth = 0) {
  if (!o || typeof o !== 'object' || Array.isArray(o) || depth > 2) return null;
  const slug = typeof o.slug === 'string' ? o.slug : '';
  const urlStr = typeof o.url === 'string' ? o.url : '';
  const title = [o.title, o.name, o.titulo].find((x) => typeof x === 'string' && x.trim());
  if ((slug || urlStr) && title) return o;
  for (const v of Object.values(o)) {
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      const f = findAnime(v, depth + 1);
      if (f) return f;
    }
  }
  return null;
}

function animeItem(o, baseUrl) {
  const a = findAnime(o);
  if (!a) return null;
  const title = [a.title, a.name, a.titulo].find((x) => typeof x === 'string' && x.trim()).trim();
  const slug = typeof a.slug === 'string' ? a.slug : '';
  const url = slug ? api.abs('/media/' + slug, baseUrl) : api.abs(a.url, baseUrl);
  let cover = '';
  for (const k of ['cover', 'poster', 'image', 'imagen', 'thumbnail', 'portada']) {
    if (typeof a[k] === 'string' && a[k]) { cover = a[k]; break; }
  }
  if (!cover && /^\d+$/.test(String(a.id == null ? '' : a.id))) cover = 'https://cdn.animeav1.com/covers/' + a.id + '.jpg';
  return { title, cover: cover ? api.abs(cover, baseUrl) : '', url };
}

// Busca en un JSON los animes agrupados por día (claves "lunes"… o campos de día/fecha)
function scheduleFromJson(root, baseUrl) {
  const byDay = {};
  const push = (day, item) => {
    if (!day || !item) return;
    const list = (byDay[day] = byDay[day] || []);
    if (!list.some((x) => x.url === item.url)) list.push(item);
  };
  const finish = () =>
    WEEK.filter((d) => byDay[d] && byDay[d].length).map((d) => ({ day: WEEK_LABEL[d], items: byDay[d] }));

  // 1) objeto con claves de día: { lunes: [...], martes: [...] }
  const keyed = (node, depth) => {
    if (!node || typeof node !== 'object' || depth > 5) return false;
    if (!Array.isArray(node)) {
      const dayKeys = Object.keys(node).filter((k) => dayOf(k));
      if (dayKeys.length >= 2) {
        dayKeys.forEach((k) => {
          const v = node[k];
          (Array.isArray(v) ? v : Object.values(v || {})).forEach((e) => push(dayOf(k), animeItem(e, baseUrl)));
        });
        return true;
      }
    }
    return Object.values(node).some((v) => keyed(v, depth + 1));
  };
  if (keyed(root, 0)) {
    const r = finish();
    if (r.length >= 2) return r;
    Object.keys(byDay).forEach((k) => delete byDay[k]);
  }

  // 2) entradas con un campo de día u hora de emisión
  const entries = [];
  const walk = (node, depth) => {
    if (!node || typeof node !== 'object' || depth > 7) return;
    if (Array.isArray(node)) { node.forEach((n) => walk(n, depth + 1)); return; }
    for (const [k, v] of Object.entries(node)) {
      if (/day|dia|dow|broadcast|airing|aired|emisi|estreno|schedule|horario/i.test(k) && (typeof v === 'string' || typeof v === 'number')) {
        entries.push({ node, key: k, v });
      }
    }
    Object.values(node).forEach((v) => walk(v, depth + 1));
  };
  walk(root, 0);
  const sundayFirst = entries.some((e) => typeof e.v === 'number' && e.v === 0 && /day|dia|dow/i.test(e.key));
  entries.forEach(({ node, key, v }) => {
    let day = '';
    if (typeof v === 'string') {
      day = dayOf(v);
      if (!day && /\d{4}-\d{2}-\d{2}/.test(v)) {
        const t = Date.parse(v);
        if (!Number.isNaN(t)) day = JS_DAYS[new Date(t).getDay()];
      }
    } else if (v > 1e12) day = JS_DAYS[new Date(v).getDay()];
    else if (v > 1e9) day = JS_DAYS[new Date(v * 1000).getDay()];
    else if (/day|dia|dow/i.test(key) && v >= 0 && v <= 7) day = sundayFirst ? JS_DAYS[v] : v >= 1 ? WEEK[v - 1] : 'domingo';
    if (day) push(day, animeItem(node, baseUrl));
  });
  return finish();
}

// Rutas de API que aparecen en la página y en los scripts de la ruta (SvelteKit)
async function discoverEndpoints(html, doc, pageUrl) {
  const found = [];
  const add = (u) => {
    try {
      const full = api.abs(u, pageUrl);
      if (!found.includes(full) && !isStaticAsset(full) && !/google|discord|facebook|cloudflare|gstatic|\/horario\/?$/i.test(full)) found.push(full);
    } catch (_) {}
  };
  const re = /["'`]((?:https?:\/\/[a-z0-9.-]*animeav1[a-z0-9.-]*)?\/(?:api|ajax)\/[A-Za-z0-9_\-\/.?=&%]*)["'`]/g;
  let m;
  while ((m = re.exec(html))) add(m[1]);

  const srcs = Array.from(doc.querySelectorAll('link[rel="modulepreload"][href], script[src]'))
    .map((el) => el.getAttribute('href') || el.getAttribute('src'))
    .filter((h) => h && /\/(nodes|chunks|entry)\//.test(h));
  const re2 = /["'`]((?:https?:\/\/[a-z0-9.-]*animeav1[a-z0-9.-]*)?\/(?:(?:api|ajax)\/[A-Za-z0-9_\-\/.?=&%]*|[A-Za-z0-9_\-\/]*(?:horario|schedule|calendar)[A-Za-z0-9_\-\/.?=&%]*))["'`]/g;
  for (const s of srcs.slice(0, 10)) {
    try {
      const js = await api.text(api.abs(s, pageUrl));
      let mm;
      while ((mm = re2.exec(js))) add(mm[1]);
    } catch (_) {}
  }
  return { found, srcs };
}

return {
  id: 'animeav1',
  name: 'AnimeAV1',
  version: 7,

  filters: FILTERS,

  async home(page = 1) {
    try {
      const url = api.abs(`/catalogo?page=${page}`, BASE_URL);
      const doc = await api.html(url);
      return parseCardList(doc, BASE_URL);
    } catch (e) {
      if (page > 1 && isNotFound(e)) return []; // ya no hay más páginas
      throw e;
    }
  },

  // Animes en emisión agrupados por día de la semana
  async schedule() {
    const url = api.abs('/horario', BASE_URL);
    const html = await api.text(url);
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // 1) si la página ya trae las tarjetas
    const direct = parseSchedule(doc, url);
    if (direct.length >= 2) return direct;

    // 2) la página las carga con JS: buscar la API en la página y en sus scripts
    const { found, srcs } = await discoverEndpoints(html, doc, url);
    const defaults = ['/horario/__data.json', '/api/horario', '/api/schedule', '/api/schedules', '/api/calendar'].map((p) => api.abs(p, BASE_URL));
    const tried = [];
    for (const ep of found.concat(defaults).filter((v, i, a) => a.indexOf(v) === i).slice(0, 14)) {
      const short = ep.replace(BASE_URL, '');
      try {
        const text = await api.text(ep, { headers: { Accept: 'application/json' } });
        let data;
        try { data = JSON.parse(text); } catch (_) { tried.push(short + ' (no JSON)'); continue; }
        if (data && Array.isArray(data.nodes)) {
          for (const node of data.nodes) {
            if (node && Array.isArray(node.data)) {
              const r = scheduleFromJson(devalueDecode(node.data), BASE_URL);
              if (r.length >= 2) return r;
            }
          }
        }
        const r = scheduleFromJson(data, BASE_URL);
        if (r.length >= 2) return r;
        tried.push(short + ' (sin días)');
      } catch (e) {
        tried.push(short + ' (' + (e && e.status ? e.status : 'error') + ')');
      }
    }
    throw new Error('probé: ' + (tried.join(' | ') || '-') + ' · scripts: ' + srcs.slice(0, 3).join(' | '));
  },

  // Episodios recién publicados (sección "Recientemente Actualizado" de la portada), en orden de salida
  async latest() {
    const url = api.abs('/', BASE_URL);
    const html = await api.text(url);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const epInfo = (a) => {
      const h = a.getAttribute('href') || '';
      if (h.includes('#')) return null;
      try {
        const u = new URL(api.abs(h, url));
        const m = u.pathname.match(/^\/media\/([^/]+)\/(\d+(?:\.\d+)?)\/?$/);
        return m ? { slug: m[1], ep: m[2], full: u.href } : null;
      } catch (_) { return null; }
    };
    const out = [];
    const seen = new Set();
    doc.querySelectorAll('a[href*="/media/"]').forEach((a) => {
      const info = epInfo(a);
      if (!info || seen.has(info.full)) return;

      // tarjeta: sube mientras el contenedor solo tenga este episodio
      let box = a;
      for (let i = 0; i < 4 && box.parentElement; i++) {
        const parent = box.parentElement;
        const others = Array.from(parent.querySelectorAll('a[href*="/media/"]'))
          .map(epInfo)
          .filter((x) => x && x.full !== info.full);
        if (others.length) break;
        box = parent;
      }
      const img = box.querySelector('img');
      const raw = img ? img.getAttribute('data-src') || img.getAttribute('src') || '' : '';

      let title = (a.getAttribute('aria-label') || a.getAttribute('title') || a.textContent || '')
        .replace(/\s+/g, ' ').trim().replace(/^Ver\s+/i, '');
      title = title.replace(new RegExp('\\s+' + info.ep.replace('.', '\\.') + '$'), '').trim();
      if (!title) {
        const h = box.querySelector('h2, h3, h4');
        title = h ? h.textContent.replace(/\s+/g, ' ').trim() : '';
      }
      if (!title) title = info.slug.replace(/-/g, ' ');

      seen.add(info.full);
      out.push({
        title,
        // la miniatura del episodio (thumbnails/ID) y la portada (covers/ID) comparten el mismo ID
        cover: raw ? api.abs(raw.replace('/thumbnails/', '/covers/'), url) : '',
        url: api.abs('/media/' + info.slug, BASE_URL),
        note: 'Episodio ' + info.ep,
        epUrl: info.full
      });
    });
    return out;
  },

  async search(query, page = 1, filters = {}) {
    const q = (query || '').trim();

    // Filtros elegidos -> parámetros de la URL (género, tipo, estado)
    const params = [];
    for (const id of Object.keys(FILTER_PARAM)) {
      const sel = filters && filters[id];
      const val = Array.isArray(sel) ? sel[0] : sel;
      if (val) params.push(`${FILTER_PARAM[id]}=${encodeURIComponent(val)}`);
    }

    const load = async (searchKey) => {
      const qs = params.slice();
      if (q) qs.push(`${searchKey}=${encodeURIComponent(q)}`);
      qs.push(`page=${page}`);
      const doc = await api.html(api.abs(`/catalogo?${qs.join('&')}`, BASE_URL));
      return parseCardList(doc, BASE_URL);
    };

    try {
      const items = await load('search');
      if (items.length > 0 || !q || page > 1) return items;
      return await load('q');
    } catch (e) {
      if (page > 1 && isNotFound(e)) return []; // ya no hay más páginas
      throw e;
    }
  },

  async details(url) {
    const absUrl = api.abs(url, BASE_URL);
    const htmlText = await api.text(absUrl);
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');

    const title = pickText(doc, ['h1', '.anime-title', 'header h1', 'main h1']);

    // Portada: og:image o la primera imagen que no sea el logo del sitio
    const goodImg = (u) => !!u && !/^data:/i.test(u) && !/logo|favicon|placeholder/i.test(u);
    const imgCandidates = [pickAttr(doc, ['meta[property="og:image"]'], 'content')].concat(
      Array.from(doc.querySelectorAll('.poster img, .cover img, article img, main img, img')).map(
        (el) => el.getAttribute('data-src') || el.getAttribute('src') || ''
      )
    );
    const coverRaw = imgCandidates.find(goodImg) || '';
    const cover = coverRaw ? api.abs(coverRaw, absUrl) : '';

    const bannerRaw = pickAttr(
      doc,
      ['.banner img', '.backdrop img', '.cover-bg img'],
      'src'
    );
    const banner = bannerRaw ? api.abs(bannerRaw, absUrl) : undefined;

    const description = pickText(doc, [
      '.synopsis',
      '.description',
      '[class*="synopsis"]',
      '[class*="description"]',
      'p'
    ]);

    const genres = Array.from(
      doc.querySelectorAll('a[href*="/catalogo?genre="], a[href*="genre="], .genres a, .genre')
    )
      .map((el) => (el.textContent || '').trim())
      .filter(Boolean);

    const metaText = doc.body ? doc.body.textContent || '' : '';
    const yearMatch = metaText.match(/\b(19\d\d|20\d\d)\b/);
    const year = yearMatch ? Number(yearMatch[1]) : undefined;

    let status;
    if (/en emisión/i.test(metaText)) {
      status = 'En emisión';
    } else if (/finalizado|completado/i.test(metaText)) {
      status = 'Finalizado';
    }

    const episodes = extractEpisodes(doc, htmlText, absUrl);

    return {
      title,
      cover,
      banner,
      description,
      genres: [...new Set(genres)],
      year,
      status,
      episodes
    };
  },

  async videos(episodeUrl, ctx) {
    const absUrl = api.abs(episodeUrl, BASE_URL);
    const html = await api.text(absUrl);
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const found = [];
    const seen = new Set();

    const addSource = (rawUrl, langHint = '') => {
      if (!rawUrl) return;
      const cleaned = String(rawUrl)
        .replace(/\\\//g, '/')
        .replace(/\\u0026/g, '&')
        .replace(/&amp;/g, '&')
        .trim();

      if (!cleaned || cleaned.startsWith('data:') || cleaned.startsWith('javascript:')) return;
      const full = api.abs(cleaned, absUrl);
      if (!full) return;
      if (seen.has(full)) {
        if (langHint) {
          const ex = found.find((f) => f.url === full);
          if (ex && !ex.lang) ex.lang = langHint;
        }
        return;
      }
      seen.add(full);

      const classified = classifyFastServer(full);
      if (classified) {
        classified.lang = langHint;
        found.push(classified);
      }
    };

    doc.querySelectorAll('iframe').forEach((iframe) => {
      addSource(
        iframe.getAttribute('src') ||
        iframe.getAttribute('data-src') ||
        iframe.getAttribute('data-lazy-src') ||
        '',
        ctxLang(iframe)
      );
    });

    doc.querySelectorAll('[data-embed], [data-player], [data-src], [data-url], [data-link]').forEach((el) => {
      addSource(
        el.getAttribute('data-embed') ||
        el.getAttribute('data-player') ||
        el.getAttribute('data-src') ||
        el.getAttribute('data-url') ||
        el.getAttribute('data-link') ||
        '',
        ctxLang(el)
      );
    });

    const unescaped = html.replace(/\\\//g, '/').replace(/\\u0026/g, '&');
    // La web agrupa los servidores bajo "SUB" y "DUB": cada URL toma el último marcador que aparece antes
    const markers = [];
    const markerRe = /["']?\b(SUB|DUB)\b["']?\s*:/g;
    let mk;
    while ((mk = markerRe.exec(unescaped))) markers.push({ i: mk.index, lang: mk[1] });
    const langAt = (idx) => {
      let l = '';
      for (const m of markers) {
        if (m.i < idx) l = m.lang;
        else break;
      }
      return l;
    };
    const urlRe = /https?:\/\/[^\s"'<>\\]+/gi;
    let um;
    while ((um = urlRe.exec(unescaped))) {
      addSource(um[0], langAt(um.index));
    }

    found.sort((a, b) => a.priority - b.priority);

    return found.map(({ label, url, type, lang }) => ({
      label,
      url,
      type,
      lang
    }));
  }
};

})();

/* ============ filtros (Género / Tipo / Estado) para cualquier módulo ============ */
const FLABEL={genre:'Género',genres:'Género',type:'Tipo',status:'Estado'};
const FCACHE={},FDONE={};
function normOpt(o){
  if(o==null)return null;
  if(Array.isArray(o))o={v:o[0],t:o[1]!=null?o[1]:o[0]};
  if(typeof o!=='object')return{v:String(o),t:String(o)};
  const v=[o.v,o.value,o.id,o.slug,o.key,o.t,o.label,o.name,o.title].find(x=>x!=null);
  const t=[o.t,o.label,o.name,o.title,o.text,o.v,o.value,o.id].find(x=>x!=null);
  return v==null?null:{v:String(v),t:String(t==null?v:t)};
}
function normFilters(raw){
  if(!raw)return[];
  if(!Array.isArray(raw))raw=Object.keys(raw).map(k=>({id:k,options:raw[k]}));
  return raw.map((f,i)=>{
    if(!f||typeof f!=='object')return null;
    const ro=f.options||f.values||f.items,opts=(Array.isArray(ro)?ro:[]).map(normOpt).filter(Boolean);
    if(!opts.length)return null;
    const id=String(f.id||f.key||f.name||('f'+i));
    return{id,label:String(f.label||FLABEL[id]||f.name||id),multi:f.multi,options:opts};
  }).filter(Boolean);
}
function filtersOf(m){
  if(FCACHE[m.id])return FCACHE[m.id];
  let f=[];
  try{f=normFilters(m.filters)}catch(e){console.error(e)}
  FCACHE[m.id]=f;return f;
}
async function loadFilters(m){
  if(FDONE[m.id]||typeof m.getFilters!=='function')return;
  try{if(normFilters(m.filters).length)return}catch(e){}
  FDONE[m.id]=1;
  try{
    const r=normFilters(await m.getFilters());
    if(r.length){FCACHE[m.id]=r;if(cur().id===m.id)refreshBars()}
  }catch(e){console.error('getFilters '+m.id,e)}
}

  return(add||[]).filter(x=>x&&x.url!=null&&!seen.has(x.url)&&seen.add(x.url)).map(x=>Object.assign({},x,{mod}));
}

function compile(code){

  if(!m||!m.id||!m.name)throw new Error('El módulo necesita "id" y "name".');

  if(typeof m.details!=='function'||typeof m.videos!=='function')throw new Error('Faltan details() y videos().');

}

/* ---- horario semanal (módulos con schedule() y filtro Estado = En emisión) ---- */
const DAY_NAMES=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const normD=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
let SCHED={day:''};
function schedActive(F){
  const m=cur();
  return (F.status||[]).some(v=>/emisi|releasing/i.test(v))&&Object.keys(F).every(k=>k==='status'||!(F[k]||[]).length);
}
async function aniWeek(){
  const d0=new Date();d0.setHours(0,0,0,0);d0.setDate(d0.getDate()-((d0.getDay()+6)%7)); // lunes 00:00 (hora local)
  const s0=Math.floor(d0.getTime()/1000),e0=s0+7*86400;
  const q='query($s:Int,$e:Int,$p:Int){Page(page:$p,perPage:50){pageInfo{hasNextPage}airingSchedules(airingAt_greater:$s,airingAt_lesser:$e,sort:TIME){airingAt media{id format countryOfOrigin isAdult title{romaji english}coverImage{large}}}}}';
  const byDay={},seen=new Set();
  for(let p=1;p<=6;p++){
    const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:q,variables:{s:s0-1,e:e0,p}})});
    if(!r.ok)throw new Error('AniList '+r.status);
    const j=await r.json(),pg=j&&j.data&&j.data.Page;if(!pg)throw new Error('AniList sin datos');
    for(const a of pg.airingSchedules){
      const md=a.media;
      if(!md||md.isAdult||md.countryOfOrigin!=='JP'||!['TV','TV_SHORT','ONA'].includes(md.format)||seen.has(md.id))continue;
      seen.add(md.id);
      const day=new Date(a.airingAt*1000).getDay();
      (byDay[day]=byDay[day]||[]).push({title:md.title.romaji||md.title.english,q:md.title.romaji||md.title.english,q2:md.title.english||'',cover:(md.coverImage&&md.coverImage.large)||'',url:'',aid:md.id});
    }
    if(!pg.pageInfo.hasNextPage)break;
  }
  const out=[1,2,3,4,5,6,0].filter(k=>byDay[k]).map(k=>({day:DAY_NAMES[k],items:byDay[k]}));
  if(out.length<2)throw new Error('AniList sin calendario');
  return out;
}
async function openByTitle(modId,names,cover){
  const m=modById(modId)||cur(),nz=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  toast('Buscando en '+m.name+'…');
  for(const n of names.filter(Boolean)){
    try{
      const r=await m.search(n,1,{});if(!r||!r.length)continue;
      const k=nz(n),hit=r.find(i=>nz(i.title)===k)||r.find(i=>nz(i.title).includes(k)||k.includes(nz(i.title)))||r[0];
      if(hit){openDetail(m.id,hit.url,{title:hit.title,cover:hit.cover||cover});return}
    }catch(e){}
  }
  toast('No está disponible en este módulo');
}
async function showSchedule(el){
  if(!el)return;const m=cur();
  el.innerHTML='<p class="empty">Cargando horario…</p>';
  let days;
  try{days=await cached('s|'+m.id,30*60*1000,async()=>{
    if(typeof m.schedule==='function'){try{const r=await m.schedule();if(Array.isArray(r)&&r.filter(d=>d&&d.items&&d.items.length).length>=2)return r}catch(_){}}
    return aniWeek();
  })}
  catch(e){
    el.innerHTML='<p class="empty">No se pudo leer el horario por días ('+esc(e.message)+')</p><button class="btn" id="schRetry">Reintentar</button><h2 class="sec">En emisión</h2><div id="schFb"><p class="empty">Cargando…</p></div>';
    const b=$('#schRetry');if(b)b.onclick=()=>{cached('s|'+m.id,0,()=>0);showSchedule(el)};
    try{const r=await m.search('',1,{status:['emision']});const fb=$('#schFb');if(fb)fb.innerHTML=r.length?grid(r.map(i=>Object.assign({},i,{mod:m.id}))):''}catch(_){const fb=$('#schFb');if(fb)fb.innerHTML=''}
    return
  }
  days=(days||[]).filter(d=>d&&d.items&&d.items.length);
  if(!days.length){el.innerHTML='<p class="empty">El horario está vacío.</p>';return}
  const today=normD(DAY_NAMES[new Date().getDay()]);
  if(!days.some(d=>normD(d.day)===SCHED.day))SCHED.day=normD((days.find(d=>normD(d.day)===today)||days[0]).day);
  const draw=()=>{
    const sel=days.find(d=>normD(d.day)===SCHED.day)||days[0];
    el.innerHTML='<div class="days">'+days.map(d=>'<button type="button" data-d="'+esc(normD(d.day))+'" class="'+(normD(d.day)===SCHED.day?'on':'')+'">'+esc(String(d.day).toUpperCase())+' <small class="cnt">'+d.items.length+'</small></button>').join('')+'</div>'+grid(sel.items.map(i=>Object.assign({},i,{mod:m.id},m.id==='anilist'&&i.aid?{url:String(i.aid),q:''}:{})));
    const dv=el.querySelector('.days'),on=el.querySelector('.days .on');
    if(dv&&on)dv.scrollLeft=on.offsetLeft-dv.clientWidth/2+on.clientWidth/2;
  };
  el.onclick=e=>{const b=e.target.closest('.days button');if(b){SCHED.day=b.dataset.d;draw()}};
  draw();
}

/* ---- "Seguir mirando": episodios nuevos de lo que ya estás viendo ---- */
function followList(){
  const f=homeSt.follow;if(!f||!f.rows)return [];
  const m=cur(),out=[];
  for(const r of f.rows){
    const eps=(r.d&&r.d.episodes)||[];
    let last=-1;eps.forEach((e,i)=>{if(viewed(PROG[epKey(m,e)]))last=i});
    if(last<0||last>=eps.length-1)continue;
    const nx=eps[last+1];
    out.push({mod:m.id,url:r.url,title:r.title||(r.d&&r.d.title)||'',cover:pickCover(r.d,r),note:'Episodio '+(nx.number||last+2)});
  }
  return out.slice(0,6);
}
async function loadFollow(){
  const st=homeSt,m=cur();if(st.follow)return;
  const seen=new Set(),cands=[];
  hist.concat(favs).forEach(x=>{if(x&&x.mod===m.id&&!seen.has(x.url)){seen.add(x.url);cands.push(x)}});
  st.follow={rows:[]};
  const pick=cands.slice(0,12);
  await Promise.all(pick.map(async x=>{
    try{const d=await cached('d|'+m.id+'|'+x.url,5*60*1000,()=>m.details(x.url));st.follow.rows.push({url:x.url,title:x.title||d.title,cover:x.cover,d})}catch(e){}
  }));
  st.follow.rows.sort((a,b)=>pick.findIndex(x=>x.url===a.url)-pick.findIndex(x=>x.url===b.url));
  if(tab==='home'&&st===homeSt&&followList().length)drawHome();
}
async function loadLatest(){
  const st=homeSt,m=cur();
  if(typeof m.latest!=='function'||st.latest!==undefined)return;
  st.latest=null;
  try{st.latest=await cached('l|'+m.id,3*60*1000,()=>m.latest())}catch(e){st.latest=[]}
  if(tab==='home'&&st===homeSt&&(st.items.length||st.done||st.err))drawHome();
}
function followHtml(){
  if(hAny())return '';
  const m=cur();
  if(typeof m.latest==='function'){
    const l=(homeSt.latest||[]).slice(0,12).map(i=>Object.assign({},i,{mod:m.id,note:i.note+(i.epUrl&&viewed(PROG[epKey(m,{url:i.epUrl})])?' ✓':'')}));
    return l.length?'<h2 class="sec">Últimos episodios</h2>'+grid(l)+'<h2 class="sec">Explorar</h2>':'';
  }
  const f=followList();
  return f.length?'<h2 class="sec">Seguir mirando</h2>'+grid(f)+'<h2 class="sec">Explorar</h2>':'';
}

let homeSt={mod:null};
async function rHome(){
  const m=cur();loadFilters(m);
  if(schedActive(HF)){$('#main').innerHTML=homeBar()+'<div id="sched"></div>';bindHomeBar();showSchedule($('#sched'));return}
  if(homeSt.mod!==m.id)homeSt={mod:m.id,items:[],page:0,done:false,loading:false,err:''};
  if(!hAny()&&typeof m.latest==='function')loadLatest();
  if(!homeSt.items.length&&!homeSt.done){$('#main').innerHTML=homeBar()+skeleton();bindHomeBar();await loadHome();return}
  drawHome();
}
async function loadHome(){
  const st=homeSt,m=cur();
  if(st.loading)return;st.loading=true;st.err='';
  try{
    const p=st.page+1;
    let r;
    if(typeof m.home==='function'&&!hAny())r=await m.home(p);
    else if(typeof m.search==='function')r=await m.search('',p,HF);
    else throw new Error('Este módulo no admite filtros.');
    if(st!==homeSt)return;
    const add=dedupe(st.items,r,m.id);
    st.page=p;if(!add.length)st.done=true;
    st.items.push(...add);
  }catch(e){
    if(st!==homeSt)return;
    if(isEnd(e,st.page+1))st.done=true;else st.err=e.message;
  }
  st.loading=false;
  if(tab==='home'&&st===homeSt)drawHome();
}
function drawHome(){
  const st=homeSt,mn=$('#main'),y=mn.scrollTop;
  mn.innerHTML=homeBar()+followHtml()+(st.items.length?grid(st.items):'')
    +(st.err?'<p class="empty">'+(st.items.length?'No se pudo cargar más: ':'No se pudo cargar: ')+esc(st.err)+'</p>':'')
    +(!st.items.length&&!st.err?'<p class="empty">'+(hAny()?'Sin resultados con esos filtros.':'Este módulo no tiene pantalla de inicio. Usa la pestaña Buscar.')+'</p>':'')
    +(!st.done&&(st.items.length||st.err)?'<button class="btn more" id="more">'+(st.err?'Reintentar':'Cargar más')+'</button>':'')
    +(st.done&&st.items.length?'<p class="note" style="text-align:center;margin:18px 0">No hay más resultados</p>':'');
  mn.scrollTop=y;bindHomeBar();
  if(!hAny()){if(typeof cur().latest==='function')loadLatest();else loadFollow()}

}

let S={q:'',items:[],page:0,done:false,err:''},SF={};
const nSel=id=>(SF[id]||[]).length;
const anyFilter=()=>Object.keys(SF).some(k=>(SF[k]||[]).length);
function sBar(){
  const fl=filtersOf(cur());
  return '<div class="frow">'+(fl.length?fl.map(f=>'<button type="button" class="fchip'+(nSel(f.id)?' on':'')+'" data-f="'+esc(f.id)+'">'+esc(f.label)+' ('+nSel(f.id)+') ▾</button>').join(''):noFiltChip())+'</div>';

function bindSearchBar(){
  document.querySelectorAll('.fchip[data-f]').forEach(b=>{b.onclick=()=>openFilter(b.dataset.f,SF,()=>{S.q=$('#sq')?$('#sq').value.trim():S.q;rSearch();doSearch(1)})});
  bindNoFilt();
}
function rSearch(){
  const m=cur();loadFilters(m);
  $('#main').innerHTML='<form id="sf" class="sbar"><input id="sq" type="search" placeholder="Buscar en '+esc(m.name)+'" enterkeyhint="search"><button>Buscar</button></form>'
    +sBar()+'<div id="sres"></div>';
  $('#sq').value=S.q;
  $('#sf').onsubmit=e=>{e.preventDefault();$('#sq').blur();doSearch(1)};
  bindSearchBar();

function refreshBars(){
  const old=$('#main .frow');if(!old)return;
  const t=document.createElement('div');
  if(tab==='home'){t.innerHTML=homeBar();old.replaceWith(t.firstChild);bindHomeBar()}
  else if(tab==='search'){t.innerHTML=sBar();old.replaceWith(t.firstChild);bindSearchBar()}
}
function openFilter(id,store,after){
  const m=cur(),f=filtersOf(m).find(x=>x.id===id);if(!f)return;
  const sel=store[id]||[];
  const items=f.options.map(o=>({k:o.v,label:o.t,on:sel.indexOf(o.v)>=0}));
  const done=keys=>{store[id]=keys;after()};
  openSheet({title:f.label,items,multi:f.multi!==false,onApply:done,onPick:k=>done(k==null?[]:[k])});
}
async function doSearch(p){
  const m=cur();
  if(p===1){
    const q=$('#sq')?$('#sq').value.trim():S.q;
    if(!q&&!anyFilter())return toast('Escribe un nombre o elige filtros');
    if(!q&&schedActive(SF)){S={q:'',items:[],page:0,done:true,err:'',busy:false,sched:true};showSchedule($('#sres'));return}
    S={q,items:[],page:0,done:false,err:'',busy:false};
    if($('#sres'))$('#sres').innerHTML=skeleton();
  }
  const st=S;
  if(st.busy)return;st.busy=true;st.err='';
  try{
    const r=await m.search(st.q,p,SF);
    if(st!==S)return;
    const add=dedupe(st.items,r,m.id);
    st.page=p;if(!add.length)st.done=true;
    st.items.push(...add);
  }catch(e){
    if(st!==S)return;
    if(isEnd(e,p))st.done=true;else st.err=e.message;
  }
  st.busy=false;
  if(tab==='search'&&st===S)drawSearch();
}
function drawSearch(){
  if(S.sched){showSchedule($('#sres'));return}
  const box=$('#sres');if(!box)return;
  const has=S.q||anyFilter();
  box.innerHTML=(S.items.length?grid(S.items):'')
    +(S.err?'<p class="empty">'+(S.items.length?'No se pudo cargar más: ':'No se pudo buscar: ')+esc(S.err)+'</p>':'')
    +(has&&!S.items.length&&!S.err?'<p class="empty">Sin resultados.</p>':'')
    +(!has?'<p class="empty">Escribe el nombre o elige filtros de género, tipo y estado.</p>':'')
    +(has&&!S.done&&(S.items.length||S.err)?'<button class="btn more" id="smore">'+(S.err?'Reintentar':'Cargar más')+'</button>':'')
    +(has&&S.done&&S.items.length?'<p class="note" style="text-align:center;margin:18px 0">No hay más resultados</p>':'');
  const b=$('#smore');if(b)b.onclick=()=>{b.textContent='Cargando…';doSearch(S.page+1)};
}

async function openDetail(modId,url,hint){

  const el=$('#detail'),tok=++dTok;
  el.hidden=false;el.scrollTop=0;
  if(stack[stack.length-1]!=='detail')pushOv('detail');

  try{
    const d=await cached('d|'+m.id+'|'+url,5*60*1000,()=>m.details(url));
    if(tok!==dTok||el.hidden)return;
    D={m,d,url,rev:false,hint};
    drawDetail();

const SRC_ADS=/(doubleclick|googlesyndication|googleadservices|adservice|adsterra|popads|popcash|propeller|exoclick|juicyads|trafficjunky|trafficfactory|clickadu|hilltopads|onclickads|adcash|revcontent|taboola|outbrain|mgid|zeropark|a-ads|bidgear|adnxs|pubmatic|histats|google-analytics|googletagmanager|\/(ads?|adv|advert|banner|popunder|popup|vast|preroll|click|track|pixel|promo|sponsor)(?=[\/.?_-]|$)|[?&](ad|ads|adv)=)/i;

const SRC_TRUST=/(zilla-networks|streamwish|hglink|swiftplayers|alions|filelions|vidhide|mp4upload|ok\.ru|okru|yourupload|filemoon|moonplayer|streamtape|strtape|strcloud|dood|ds2play|mega\.nz|mega\.io|voe\.sx|vidguard|vgfplay|uqload|mixdrop|streamhub|upstream|krakenfiles|pixeldrain|gofile|drive\.google|mediafire|1fichier|burstcloud|sendvid|vk\.com|rutube|dailymotion)/i;
function srcLang(s){
  const t=' '+((s.lang||'')+' '+(s.label||'')).toLowerCase()+' ';
  if(/\b(sub|subs|subtitulado|subtitulada|vose|jap)\b|sub[-_ ]?(esp|spa|es)/.test(t))return 'Sub español';
  if(/latino|latam|\bdub(bed)?\b|doblad|\blat\b/.test(t))return 'Español latino';
  if(/castellano|\bcast\b|\besp\b|\bspa\b|espa[nñ]ol/.test(t))return 'Español';
  return '';
}
function nameSrcs(list){
  const cnt={};
  return list.map(s=>{
    let host='';try{host=new URL(s.url).hostname.replace(/^www\./,'')}catch(e){}
    const base=(s.base||s.label||host||'Servidor').trim(),lang=srcLang(s);
    const k=base+'|'+lang;cnt[k]=(cnt[k]||0)+1;
    const flag=lang==='Sub español'?'🇯🇵':lang==='Español latino'?'🇲🇽':lang==='Español'?'🇪🇸':'';
    return Object.assign({},s,{base,tag:lang,flag,pk:k,label:base+(cnt[k]>1?' '+cnt[k]:'')});

function shortClip(url){return new Promise(res=>{
  const v=document.createElement('video');v.preload='metadata';v.muted=true;
  let t;const done=r=>{clearTimeout(t);try{v.removeAttribute('src');v.load()}catch(e){}res(r)};
  t=setTimeout(()=>done(false),3500);
  v.onloadedmetadata=()=>done(isFinite(v.duration)&&v.duration>0&&v.duration<60);

async function prepSrcs(list){
  const seen=new Set(),all=[];
  for(const s of (list||[])){
    if(!s||!s.url)continue;
    const url=String(s.url).trim(),key=url.split('#')[0];
    if(seen.has(key))continue;seen.add(key);
    all.push(Object.assign({},s,{url,type:s.type||guess(url)}));
  }
  let kept=all.filter(s=>!SRC_ADS.test(s.url)&&!/\.(jpe?g|png|gif|webp|svg|ico|css|js)(\?|$)/i.test(s.url)&&!(s.type!=='embed'&&SRC_JUNK_DIRECT.test(s.url)));
  const trusted=kept.filter(s=>s.type==='hls'||s.type==='mp4'||SRC_TRUST.test(s.url));
  if(trusted.length)kept=trusted;
  kept=(await Promise.all(kept.map(async s=>(s.type==='mp4'&&await shortClip(s.url))?null:s))).filter(Boolean);
  if(!kept.length)kept=all;

  const mode=FITS[fitI][0];
  $('#pFit').textContent='Escala: '+FITS[fitI][1];
  if(vid)vid.style.objectFit=mode;
  const f=$('#vbox iframe');
  if(!f)return;
  /* reproductor incrustado: la ventana se ajusta a 16:9 y se amplía hasta llenar la pantalla,
     así su barra de tiempo queda completa de borde a borde */
  const st=$('#stage'),W=st.clientWidth,H=st.clientHeight;
  if(mode==='contain'||W<50||H<50){f.removeAttribute('style');return}
  const r=(W/H)/(16/9),s=f.style;
  if(r>=1){
    const Wi=H*16/9;
    s.width=Wi+'px';s.height=H+'px';s.left=((W-Wi)/2)+'px';s.right='auto';s.top='0';s.bottom='auto';

    s.transform=mode==='cover'?'scale('+r+')':'scale('+r+',1)';
  }else{

    s.width=W+'px';s.height=Hi+'px';s.left='0';s.right='auto';s.top=((H-Hi)/2)+'px';s.bottom='auto';

  if(!P||!P.srcs||!P.srcs.length)return toast('Aún no hay fuentes');
  {
    const items=P.srcs.map((s,k)=>({k,label:s.label||('Servidor '+(k+1)),tag:s.tag,flag:s.flag,on:k===curK}));
    const extra=P.rawAll?P.rawAll.length-P.srcs.length:0;
    if(extra>0)items.push({k:-1,label:'Mostrar todos ('+extra+' ocultos)',on:false});
    openSheet({title:'Servidor',items,multi:false,keep:true,onPick:k=>{
      if(k==null)return;
      if(k===-1){P.srcs=P.rawAll;P.rawAll=null;setTimeout(()=>$('#pQ').click(),80);return}
      P.pref=P.srcs[k].pk||null;pickSrc(k)
    }});
  }
};

/* reproductor incrustado: al tocar el video aparecen las opciones (y se ocultan solas); la franja de arriba también las muestra */
$('#pReveal').onclick=()=>{$('#stage').classList.remove('clean');$('#stage').focus();armClean(4000)};
window.addEventListener('blur',()=>{
  setTimeout(()=>{
    const a=document.activeElement;
    if(P&&a&&a.tagName==='IFRAME'){$('#stage').classList.remove('clean');armClean(4000)}
  },0);
});

/* ---- gestos: izquierda=brillo, derecha=volumen, horizontal=adelantar/atrasar, doble toque=±10 s ---- */
let G=null,tapT=0,tapTimer=null;
stg.addEventListener('touchstart',e=>{
  if(!vid||e.target.closest('button,input'))return;
  const t=e.touches[0],r=stg.getBoundingClientRect();
  G={x:t.clientX,y:t.clientY,side:(t.clientX-r.left)<r.width/2?'L':'R',mode:null,sv:vid.volume,sb:bright,st:vid.currentTime,w:r.width,h:r.height,target:null};
},{passive:true});
stg.addEventListener('touchmove',e=>{
  if(!G||!vid||locked)return;
  const t=e.touches[0],dx=t.clientX-G.x,dy=t.clientY-G.y;
  if(!G.mode){
    if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
    G.mode=Math.abs(dx)>Math.abs(dy)?'seek':(G.side==='L'?'bri':'vol');
  }
  e.preventDefault();
  if(G.mode==='seek'&&vid.duration){
    const d=dx/G.w*Math.min(240,vid.duration);
    G.target=clamp(G.st+d,0,vid.duration);
    hud((d>=0?'+':'-')+Math.abs(Math.round(d))+' s · '+fmt(G.target));
  }else if(G.mode==='bri'){
    bright=clamp(G.sb-dy/G.h*1.4,0.2,1.6);applyBright();hud('☀ '+Math.round(bright*100)+'%');
  }else if(G.mode==='vol'){
    vol=clamp(G.sv-dy/G.h*1.4,0,1);vid.volume=vol;updBars();hud('🔊 '+Math.round(vol*100)+'%');
  }
},{passive:false});
stg.addEventListener('touchend',()=>{
  if(!G)return;const g=G;G=null;
  if(locked){$('#pUnlock').hidden=false;clearTimeout(unlT);unlT=setTimeout(()=>{$('#pUnlock').hidden=true},2500);return}
  if(g.mode){
    if(g.mode==='seek'&&vid&&g.target!=null)vid.currentTime=g.target;
    if(g.mode==='bri')LS.set('bri',bright);
    if(g.mode==='vol')LS.set('vol',vol);
    hideHud();return;
  }
  const now=Date.now();
  if(vid&&now-tapT<300){
    clearTimeout(tapTimer);tapT=0;
    vid.currentTime=clamp(vid.currentTime+(g.side==='L'?-10:10),0,vid.duration||1e9);
    hud(g.side==='L'?'↺ -10 s':'+10 s ↻');hideHud(600);return;
  }
  tapT=now;
  tapTimer=setTimeout(()=>{tapT=0;stg.classList.toggle('show');if(stg.classList.contains('show'))armHide()},300);
});

/* ============ inicio ============ */
loadMods();
setTab('home');

/* ============ botón/gesto atrás de Android ============ */
try{
  const AppP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  if(AppP&&AppP.addListener){
    AppP.addListener('backButton',()=>{
      if(!$('#sheet').hidden)closeSheet();
      else if(stack.length)history.back();
      else if(tab!=='home')setTab('home');
      else AppP.exitApp();
    });
  }
}catch(e){}
</script>
