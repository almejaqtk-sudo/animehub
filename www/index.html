<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14121f">
<title>AnimeHub</title>
<style>
:root{--bg:#14121f;--card:#1e1b2e;--card2:#2a2640;--tx:#efeaf7;--mut:#8f89a8;--ac:#ff7a9c;--ok:#7be0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h3{margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo span{color:var(--ac)}
#modSel{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #ffffff14;border-radius:999px;padding:6px 14px 6px 6px;font-size:15px;font-weight:700;max-width:62%;min-width:0}
#modSel .mic{width:38px;height:38px;border-radius:12px;font-size:13px}
#modSel .mn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modSel .chev{color:var(--mut);font-size:12px}
#mpick{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center}
.mp-bg{position:absolute;inset:0;background:#000b}
.mp-box{position:relative;width:min(90vw,420px);max-height:82vh;background:var(--card);border-radius:28px;display:flex;flex-direction:column;padding:22px 8px 12px;box-shadow:0 10px 40px #000a}
.mp-top{display:grid;place-items:center;color:#b9c6ff}
#mpL{overflow-y:auto;padding:0 6px;margin-top:4px}
.mp-g{text-align:center;font-weight:700;font-size:15px;letter-spacing:.6px;text-transform:uppercase;opacity:.85;margin:16px 0 6px}
.mp-row{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;padding:8px 12px;text-align:left;border-radius:18px;color:var(--tx)}
.mp-row.on{background:var(--card2)}
.mp-row .mic{width:60px;height:60px;border-radius:18px;font-size:18px}
.mp-t{flex:1;min-width:0}.mp-t b{display:block;font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-t small{display:block;color:var(--mut);font-size:14px;margin-top:3px}
.mp-ok{color:var(--ok);font-size:22px;padding-right:6px}
.mp-foot{display:flex;justify-content:flex-end;padding:10px 18px 4px}
#mpX{background:none;border:0;color:#b9c6ff;font-weight:700;font-size:18px;padding:10px 14px}
#main{flex:1;overflow-y:auto;padding:6px 14px 96px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#100e1a;border-top:1px solid #ffffff10;padding-bottom:env(safe-area-inset-bottom);z-index:5}
#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button i{font-style:normal;font-size:20px;line-height:1}
#tabs button.on{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;align-self:start}
.poster{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);position:relative}
.poster img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--card2)}
.ct{font-size:12.5px;margin-top:6px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:11px;color:var(--mut);margin-top:2px}
.sk{aspect-ratio:2/3;border-radius:10px;background:var(--card);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.empty{color:var(--mut);text-align:center;padding:36px 12px;line-height:1.5}
.btn{display:block;width:100%;background:var(--ac);color:#1b0a10;font-weight:700;border:0;border-radius:12px;padding:13px;margin:10px 0}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.more{background:var(--card2);color:var(--tx);margin:18px 0}
.sm{background:var(--card2);border:0;border-radius:9px;padding:7px 11px;font-size:12px}
.sm.del{color:var(--ac)}
input,textarea,select{background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:12px;width:100%}
textarea{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sbar{display:flex;gap:8px;margin:6px 0 16px}
.sbar button{background:var(--ac);color:#1b0a10;font-weight:700;border:0;border-radius:12px;padding:0 16px}
main h3,#detail h3{font-size:15px;margin:22px 0 10px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.mrow>div{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.cic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.cin{flex:1;min-width:0}.cin b{display:block;font-size:16px}.cin small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.dl{flex:none;width:46px;height:46px;border-radius:99px;border:1px solid var(--card2);background:none;color:var(--ac);font-size:20px;display:grid;place-items:center}
.dl.ok{color:var(--ok)}.dl.up{color:#ffd166}
.mtitle{font-size:30px;font-weight:800;margin:14px 4px 6px;letter-spacing:-.5px}
.mtabs{display:flex;border-bottom:1px solid var(--card2);margin:6px 0 14px}
.mtabs button{flex:1;background:none;border:0;color:var(--tx);font-weight:700;font-size:16px;padding:14px 4px 12px;border-bottom:3px solid transparent}
.mtabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.mtabs .cnt{font-size:11px;background:var(--card2);color:var(--tx);border-radius:99px;padding:2px 7px;margin-left:6px}
.mc{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px}
.mc.act{box-shadow:inset 0 0 0 1.5px var(--ok)}
.mic{flex:none;width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;overflow:hidden;position:relative}
.mic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
.mci{flex:1;min-width:0}.mci b{display:block;font-size:18px;line-height:1.2}
.mci small{display:block;color:var(--tx);opacity:.85;font-size:12.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mci small.v{color:var(--mut);opacity:1}
.mchips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.mchip{background:var(--card2);border:0;border-radius:99px;padding:5px 10px;font-size:11px;color:var(--mut)}
.mbt{flex:none;width:70px;height:52px;border-radius:99px;border:1px solid var(--card2);background:none;color:var(--ac);font-size:21px;display:grid;place-items:center}
.mbt.up{color:#ffd166}.mbt.ok{color:var(--ok)}
.mrow small{display:block;color:var(--mut);margin-top:2px;font-size:11px}
.tag{font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:3px 8px}
.note{color:var(--mut);font-size:12px;line-height:1.5}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:24px;line-height:1}
.dhead{height:250px;background-size:cover;background-position:center;position:relative}
.dhead::after{content:"";position:absolute;inset:0;background:linear-gradient(#14121f55,var(--bg))}
.dbody{position:relative;z-index:2;margin-top:-100px;padding:0 16px 48px}
.drow{display:flex;gap:14px;align-items:flex-end}
.dcover{width:108px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--card)}
.drow h1{font-size:19px;line-height:1.25}
.meta{color:var(--mut);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chips span,.chips button{background:var(--card2);border:0;border-radius:999px;padding:5px 11px;font-size:12px}
.chips button.on{background:var(--ac);color:#1b0a10;font-weight:700}
.acts{display:flex;gap:8px}
.acts .btn{margin:12px 0 4px}
.desc{white-space:pre-line;line-height:1.55;font-size:14px;color:#cfc8e2;max-height:6.2em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.eh{display:flex;align-items:center;justify-content:space-between}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:12px;padding:10px 12px;color:inherit;text-align:left;position:relative;overflow:hidden;width:100%}
.ep .n{min-width:34px;height:34px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px}
.ep .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.ep .chk{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.ep.viewed{opacity:.62}
.ep.viewed .n{background:var(--ok);color:#08210f}
.ep.viewed .chk{background:var(--ok);border-color:var(--ok);color:#08210f}
.sh-row .tag{margin-left:auto;flex:none;font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--ac)}
.sh-row .tag.lat{color:var(--ok)}
.sh-row .tag .fl{font-size:17px;line-height:1;vertical-align:-2px}
.sec{margin:16px 4px 8px;font-size:19px;font-weight:700}
.cn{padding:0 10px 10px;color:var(--ac);font-weight:700;font-size:13px;text-align:left}
.days{display:flex;overflow-x:auto;gap:4px;border-bottom:1px solid var(--card2);margin:6px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;background:none;border:0;color:var(--mut);font-weight:700;letter-spacing:1px;padding:12px 14px;border-bottom:3px solid transparent}
.days .cnt{font-size:11px;background:var(--card2);color:var(--tx);border-radius:99px;padding:2px 7px;margin-left:5px;letter-spacing:0}
.days button.on{color:var(--ac);border-bottom-color:var(--ac)}
.dhead .dhimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#player{z-index:20;background:#000;overflow:hidden;--pl:#b9c6ff}
#stage{position:absolute;inset:0;background:#000;user-select:none;touch-action:none}
#vbox,#vbox video,#vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#vbox video{object-fit:contain}
#ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#000c,#0000 30%,#0000 55%,#000d);opacity:0;pointer-events:none;transition:opacity .2s;color:var(--pl);padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#stage.show #ctl{opacity:1;pointer-events:auto}
#ctl button{background:none;border:0;color:var(--pl)}
.ctop{display:flex;align-items:flex-start;gap:12px}
#pBack{font-size:28px;line-height:1;color:#fff!important;padding:2px 8px}
#pTitle{flex:1;min-width:0;text-align:center;line-height:1.3;color:#e6e9f5}
#pT1{display:block;font-size:17px;font-weight:700}
#pT2{display:block;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1.5px solid #ffffff44!important;border-radius:999px;padding:11px 18px!important;font-size:14px;font-weight:700;background:#0005!important}
.side{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;pointer-events:none}
.side.L{left:max(14px,env(safe-area-inset-left))}
.side.R{right:max(14px,env(safe-area-inset-right))}
.vbar{width:14px;height:34vh;background:#ffffff26;border-radius:8px;overflow:hidden;position:relative}
.vbar i{position:absolute;left:0;right:0;bottom:0;background:var(--pl);border-radius:8px}
.cmid{display:flex;justify-content:center;align-items:center;gap:clamp(24px,10vw,90px)}
.cmid button{font-size:20px;font-weight:700;padding:10px}
#pPlay{width:84px;height:84px;display:grid;place-items:center;padding:0}
#pPlay svg{width:68px;height:68px}
.cbot{display:flex;flex-direction:column;gap:4px}
.seek{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
#pSeek{flex:1;height:26px;background:none;border:0;padding:0;accent-color:var(--pl)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tools button{font-size:14px;font-weight:700;padding:8px 6px}
#stage.novid #ctl{opacity:1;pointer-events:none;background:none}
#stage.novid .side,#stage.novid .cmid,#stage.novid .seek,#stage.novid #pLock,#stage.novid #pSpd,#stage.novid #pSkip,#stage.novid #pTitle{display:none}
#stage.novid #pBack{pointer-events:auto;background:#0008!important;border-radius:50%;width:42px;height:42px;padding:0}
#stage.novid .cbot{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
#stage.novid .tools{pointer-events:auto;gap:8px}
#stage.novid .tools button{background:#0008!important;border-radius:999px;padding:8px 12px}
#pUnlock{position:absolute;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);background:#000a;border:0;color:#fff;border-radius:50%;width:52px;height:52px;font-size:22px}
#pMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:14px;color:#ddd;pointer-events:none}
#hud{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:#000b;color:#fff;font-size:15px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
#hud.on{opacity:1}
#pReveal{display:none;position:absolute;top:0;left:0;right:0;height:44px;background:none;border:0;padding:0}
#stage.novid.clean #pReveal{display:block}
#stage.novid.clean #ctl{opacity:0}
#stage.novid.clean #pBack,#stage.novid.clean .tools{pointer-events:none}
#stage{outline:none}
.pill{text-transform:uppercase}
#pRw svg,#pFw svg{width:60px;height:60px}
.sico{flex:none;background:none;border:0;padding:6px 10px 6px 4px;color:var(--tx);display:grid;place-items:center}
.frow{display:flex;gap:8px;overflow-x:auto;margin:-6px 0 14px;padding-bottom:4px}
.fchip{flex:none;background:none;border:1.5px solid #ffffff2e;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.fchip.on{border-color:var(--ac);color:var(--ac)}
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:#0009}
.sh-box{position:relative;width:min(94vw,460px);max-height:84vh;background:var(--card);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(orientation:landscape){#sheet{align-items:center}.sh-box{border-radius:18px;max-height:90vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:16px}
#shX{background:none;border:0;font-size:20px;padding:4px 8px}
#shL{overflow-y:auto;padding:0 6px}
.sh-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:13px 12px;font-size:15px;text-align:left}
.sh-row .rb{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:none}
.sh-row.on .rb{border-color:var(--ac);background:radial-gradient(var(--ac) 45%,transparent 50%)}
#shF{display:flex;gap:8px;padding:10px 12px}
#shF button{flex:1;margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="top"><div class="logo">Anime<span>Hub</span></div><button id="modSel" type="button" aria-label="Elegir módulo"></button></header>
  <main id="main"></main>
  <nav id="tabs">
    <button data-t="home"><i>⌂</i>Inicio</button>
    <button data-t="search"><i>⌕</i>Buscar</button>
    <button data-t="favs"><i>★</i>Mi lista</button>
    <button data-t="mods"><i>⚙</i>Módulos</button>
  </nav>
</div>

<section id="detail" class="ov" hidden></section>

<section id="player" class="ov" hidden>
  <div id="stage" tabindex="-1">
    <div id="vbox"></div>
    <div id="ctl">
      <div class="ctop">
        <button id="pBack" aria-label="Volver">←</button>
        <div id="pTitle"><span id="pT1"></span><span id="pT2"></span></div>
        <button id="pSkip" class="pill">Omitir opening</button>
      </div>
      <div class="side L"><div class="vbar"><i id="bBri"></i></div><span>☀</span></div>
      <div class="side R"><div class="vbar"><i id="bVol"></i></div><span>🔊</span></div>
      <div class="cmid"><button id="pRw" aria-label="Atrasar 10 segundos"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="16.2" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg></button><button id="pPlay" aria-label="Reproducir o pausar"></button><button id="pFw" aria-label="Adelantar 10 segundos"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M18 13c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2z"/><text x="12" y="16.2" font-size="6.5" font-weight="700" text-anchor="middle" fill="currentColor">10</text></svg></button></div>
      <div class="cbot">
        <div class="seek"><span id="pCur">0:00</span><input type="range" id="pSeek" min="0" max="1000" value="0"><span id="pDur">0:00</span></div>
        <div class="tools"><button id="pFit">Escala: Ajustar</button><button id="pLock">Bloquear</button><button id="pEps">Episodios</button><button id="pQ">Servidor</button><button id="pSpd">1x</button></div>
      </div>
    </div>
    <button id="pUnlock" hidden aria-label="Desbloquear">🔓</button>
    <div id="pMsg"></div>
    <div id="hud"></div>
    <button id="pReveal" aria-label="Mostrar opciones"></button>
  </div>
</section>

<div id="sheet" hidden>
  <div class="sh-bg"></div>
  <div class="sh-box">
    <div class="sh-h"><b id="shT"></b><button id="shX" aria-label="Cerrar">✕</button></div>
    <div id="shL"></div>
    <div id="shF"><button class="btn ghost" id="shClear">Limpiar</button><button class="btn" id="shApply">Aplicar</button></div>
  </div>
</div>

<div id="mpick" hidden>
  <div class="mp-bg"></div>
  <div class="mp-box">
    <div class="mp-top"><svg viewBox="0 0 24 24" width="38" height="38"><path fill="currentColor" d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.5 0 2.7 1.2 2.7 2.7S5 16.2 3.5 16.2H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.5 1.2-2.7 2.7-2.7s2.7 1.2 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg></div>
    <div id="mpL"></div>
    <div class="mp-foot"><button type="button" id="mpX">Cancelar</button></div>
  </div>
</div>

<div id="toast"></div>

function extractEpisodes(doc, htmlText, animeUrl) {

  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#modSel').style.display=(t==='home'||t==='search')?'':'none';
  render();
}
function render(){({home:rHome,search:rSearch,favs:rFavs,mods:rMods})[tab]()}
const skeleton=()=>'<div class="grid">'+'<div class="sk"></div>'.repeat(9)+'</div>';
const tidyTitle=t=>String(t||'').replace(/^thumbnail for\s+/i,'').trim();
function grid(items){
  return '<div class="grid">'+items.map(i=>'<button class="card" data-m="'+esc(i.mod||cur().id)+'" data-u="'+esc(i.url)+'" data-t="'+esc(i.title)+'" data-c="'+esc(i.cover)+'"><div class="poster"><span class="ph">'+esc((tidyTitle(i.title)[0]||'?').toUpperCase())+'</span><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(i.cover)+'" alt="" onerror="this.style.visibility='hidden'"></div><div class="ct">'+esc(tidyTitle(i.title))+'</div>'+(i.note?'<div class="cn">'+esc(i.note)+'</div>':'')+'</button>').join('')+'</div>';
}
document.addEventListener('error',e=>{
  const im=e.target;if(!im||im.tagName!=='IMG'||im.dataset.fb||!/^https?:/i.test(im.src))return;
  im.dataset.fb='1';
  const card=im.closest('.card');
  const refs=[];
  try{if(card&&card.dataset.u)refs.push(new URL(card.dataset.u).origin+'/')}catch(_){}
  try{refs.push(new URL(im.src).origin+'/')}catch(_){}
  const tryRef=(idx)=>{
    if(idx>=refs.length)return;
    fetch(im.src,{headers:{Referer:refs[idx]}}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{
      if(b&&b.size>300&&/image/i.test(b.type)){im.src=URL.createObjectURL(b);im.style.visibility='visible'}
      else tryRef(idx+1);
    }).catch(()=>tryRef(idx+1));
  };
  tryRef(0);
},true);

  if(c)openDetail(c.dataset.m,c.dataset.u,{title:c.dataset.t,cover:c.dataset.c});
});

let homeSt={mod:null};
async function rHome(){
  const m=cur();loadFilters(m);
  if(homeSt.mod!==m.id)homeSt={mod:m.id,items:[],page:0,done:false,loading:false,err:''};
  if(!homeSt.items.length&&!homeSt.done){$('#main').innerHTML=homeBar()+skeleton();bindHomeBar();await loadHome();return}
  drawHome();
}
async function loadHome(){
  const st=homeSt,m=cur();
  if(st.loading)return;st.loading=true;st.err='';
  try{
    const p=st.page+1;
    let r;
    if(typeof m.home==='function'&&!hAny())r=await m.home(p);
    else if(typeof m.search==='function')r=await m.search('',p,HF);
    else throw new Error('Este módulo no admite filtros.');
    if(st!==homeSt)return;
    const add=dedupe(st.items,r,m.id);
    st.page=p;if(!add.length)st.done=true;
    st.items.push(...add);
  }catch(e){
    if(st!==homeSt)return;
    if(isEnd(e,st.page+1))st.done=true;else st.err=e.message;
  }
  st.loading=false;
  if(tab==='home'&&st===homeSt)drawHome();
}
function drawHome(){
  const st=homeSt,mn=$('#main'),y=mn.scrollTop;
  mn.innerHTML=homeBar()+(st.items.length?grid(st.items):'')
    +(st.err?'<p class="empty">'+(st.items.length?'No se pudo cargar más: ':'No se pudo cargar: ')+esc(st.err)+'</p>':'')
    +(!st.items.length&&!st.err?'<p class="empty">'+(hAny()?'Sin resultados con esos filtros.':'Este módulo no tiene pantalla de inicio. Usa la pestaña Buscar.')+'</p>':'')
    +(!st.done&&(st.items.length||st.err)?'<button class="btn more" id="more">'+(st.err?'Reintentar':'Cargar más')+'</button>':'')
    +(st.done&&st.items.length?'<p class="note" style="text-align:center;margin:18px 0">No hay más resultados</p>':'');
  mn.scrollTop=y;bindHomeBar();
  const mb=$('#more');if(mb)mb.onclick=()=>{mb.textContent='Cargando…';loadHome()};
}

function openFilter(id,store,after){
  const m=cur(),f=filtersOf(m).find(x=>x.id===id);if(!f)return;
  const sel=store[id]||[];
  const items=f.options.map(o=>({k:o.v,label:o.t,on:sel.indexOf(o.v)>=0}));
  const done=keys=>{store[id]=keys;after()};
  openSheet({title:f.label,items,multi:f.multi!==false,onApply:done,onPick:k=>done(k==null?[]:[k])});
}
async function doSearch(p){
  const m=cur();
  if(p===1){
    const q=$('#sq')?$('#sq').value.trim():S.q;
    if(!q&&!anyFilter())return toast('Escribe un nombre o elige filtros');
    S={q,items:[],page:0,done:false,err:'',busy:false};
    if($('#sres'))$('#sres').innerHTML=skeleton();
  }
  const st=S;
  if(st.busy)return;st.busy=true;st.err='';
  try{
    const r=await m.search(st.q,p,SF);
    if(st!==S)return;
    const add=dedupe(st.items,r,m.id);
    st.page=p;if(!add.length)st.done=true;
    st.items.push(...add);
  }catch(e){
    if(st!==S)return;
    if(isEnd(e,p))st.done=true;else st.err=e.message;
  }
  st.busy=false;
  if(tab==='search'&&st===S)drawSearch();
}
function drawSearch(){
  const box=$('#sres');if(!box)return;
  const has=S.q||anyFilter();
  box.innerHTML=(S.items.length?grid(S.items):'')
    +(S.err?'<p class="empty">'+(S.items.length?'No se pudo cargar más: ':'No se pudo buscar: ')+esc(S.err)+'</p>':'')
    +(has&&!S.items.length&&!S.err?'<p class="empty">Sin resultados.</p>':'')
    +(!has?'<p class="empty">Escribe el nombre o elige filtros de género, tipo y estado.</p>':'')
    +(has&&!S.done&&(S.items.length||S.err)?'<button class="btn more" id="smore">'+(S.err?'Reintentar':'Cargar más')+'</button>':'')
    +(has&&S.done&&S.items.length?'<p class="note" style="text-align:center;margin:18px 0">No hay más resultados</p>':'');

const catColor=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return 'hsl('+h+',45%,32%)'};
const MCATS=[['anime','Anime'],['hentai','Hentai'],['adulto','Adulto']];
const normCat=c=>{c=String(c||'').toLowerCase();return /hent/.test(c)?'hentai':/adult|xxx|\+?18|porn|jav|r34|rule/.test(c)?'adulto':/anime|donghua|dorama/.test(c)?'anime':''};
const guessCat=t=>/hentai|henao|hanime|henta/i.test(t)?'hentai':/rule34|r34|jav|porn|xxx|xvideo|nsfw|erotic|adult|sexo/i.test(t)?'adulto':'anime';
const domainOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
function siteOf(m){
  if(m.site)return String(m.site);
  const it=installed.find(x=>x.id===m.id);
  if(it){const a=it.code.match(/BASE_URL\s*=\s*['"`](https?:\/\/[^'"`\s]+)/)||it.code.match(/https?:\/\/[^'"`\s\)]+/);if(a)return a[1]||a[0]}
  return m.builtin?'https://animeav1.com':'';
}
function resolveCat(id,name,site,declared){

  return ov[id]||normCat(declared)||guessCat(id+' '+name+' '+domainOf(site));
}

let D=null,dTok=0;
async function openDetail(modId,url,hint){
  hint=hint||{};
  const m=modById(modId);if(!m)return toast('Ese módulo ya no está instalado');
  const el=$('#detail'),tok=++dTok;

  setHead(hint.cover);
  $('#dBack').onclick=()=>history.back();
  try{
    const d=await cached('d|'+m.id+'|'+url,5*60*1000,()=>m.details(url));

    D={m,d,url,rev:false,hint};

    if(tok!==dTok||el.hidden)return;

  }
}
function setHead(u){const h=$('#dHead');if(!h||!u)return;h.innerHTML='<img class="dhimg" referrerpolicy="no-referrer" alt="" src="'+esc(u)+'" onerror="this.remove()">'}
const badCover=u=>!u||/logo|logito|favicon|placeholder|no-?image|\/web\.jpg/i.test(String(u));
const pickCover=(d,h)=>[d&&d.cover,h&&h.cover].find(u=>!badCover(u))||(d&&d.cover)||(h&&h.cover)||'';
const viewed=p=>!!p&&(p.done||(p.seen&&!p.d));
function markSeen(key){if(!key)return;const p=PROG[key]||{};if(p.done||p.seen)return;p.seen=true;PROG[key]=p;saveProg()}
const epKey=(m,e)=>m.id+'|'+e.url;
const CACHE=new Map();
function cached(key,ttl,fn){
  const c=CACHE.get(key);if(c&&Date.now()-c.t<ttl)return c.p;
  const p=Promise.resolve().then(fn);CACHE.set(key,{t:Date.now(),p});
  p.catch(()=>{if(CACHE.get(key)&&CACHE.get(key).p===p)CACHE.delete(key)});
  return p;
}
const SRC_ADS=/(doubleclick|googlesyndication|googleadservices|adservice|adsterra|popads|popcash|propeller|exoclick|juicyads|trafficjunky|trafficfactory|clickadu|hilltopads|onclickads|adcash|revcontent|taboola|outbrain|mgid|zeropark|a-ads|bidgear|adnxs|pubmatic|histats|google-analytics|googletagmanager|\/(ads?|adv|advert|banner|popunder|popup|vast|preroll|click|track|pixel|promo|sponsor)(?=[\/.?_-]|$)|[?&](ad|ads|adv)=)/i;
const SRC_JUNK_DIRECT=/(thumb|poster|preview|cover|teaser|trailer|sample|promo|logo)/i;
const SRC_TRUST=/(zilla-networks|streamwish|hglink|swiftplayers|alions|filelions|vidhide|mp4upload|ok\.ru|okru|yourupload|filemoon|moonplayer|streamtape|strtape|strcloud|dood|ds2play|mega\.nz|mega\.io|voe\.sx|vidguard|vgfplay|uqload|mixdrop|streamhub|upstream|krakenfiles|pixeldrain|gofile|drive\.google|mediafire|1fichier|burstcloud|sendvid|vk\.com|rutube|dailymotion|hentaiplayer)/i;
function srcLang(s){
  const t=' '+((s.lang||'')+' '+(s.label||'')).toLowerCase()+' ';
  if(/(sub|subs|subtitulado|subtitulada|vose|jap)|sub[-_ ]?(esp|spa|es)/.test(t))return 'Sub español';
  if(/latino|latam|dub(bed)?|doblad|lat/.test(t))return 'Español latino';
  if(/castellano|cast|esp|spa|espa[nñ]ol/.test(t))return 'Español';
  return '';
}
function nameSrcs(list){
  const cnt={};
  return list.map(s=>{
    let host='';try{host=new URL(s.url).hostname.replace(/^www\./,'')}catch(e){}
    const base=(s.base||s.label||host||'Servidor').trim(),lang=srcLang(s);
    const k=base+'|'+lang;cnt[k]=(cnt[k]||0)+1;
    const flag=lang==='Sub español'?'🇯🇵':lang==='Español latino'?'🇲🇽':lang==='Español'?'🇪🇸':'';
    return Object.assign({},s,{base,tag:lang,flag,pk:k,label:base+(cnt[k]>1?' '+cnt[k]:'')});
  });
}
async function prepSrcs(list){
  const seen=new Set(),all=[];
  for(const s of (list||[])){
    if(!s||!s.url)continue;
    const url=String(s.url).trim(),key=url.split('#')[0];
    if(seen.has(key))continue;seen.add(key);
    all.push(Object.assign({},s,{url,type:s.type||guess(url)}));
  }
  let kept=all.filter(s=>!SRC_ADS.test(s.url)&&!/\.(jpe?g|png|gif|webp|svg|ico|css|js)(\?|$)/i.test(s.url)&&!(s.type!=='embed'&&SRC_JUNK_DIRECT.test(s.url)));
  const trusted=kept.filter(s=>s.type==='hls'||s.type==='mp4'||SRC_TRUST.test(s.url));
  if(trusted.length)kept=trusted;
  if(!kept.length)kept=all;
  const out=nameSrcs(kept.slice(0,12));
  out.raw=nameSrcs(all);out.hidden=Math.max(0,all.length-out.length);
  return out;
}
const loadVideos=(m,d,ep)=>cached('v|'+m.id+'|'+ep.url,10*60*1000,()=>Promise.resolve(m.videos(ep.url,{detail:d,episode:ep})).then(prepSrcs));

  const title=d.title||hint.title,cover=pickCover(d,hint);
  setHead(d.banner||cover);
  const nextI=Math.max(0,eps.findIndex(e=>!viewed(PROG[epKey(m,e)])));
  const started=eps.some(e=>PROG[epKey(m,e)]);
  $('.dbody',el).innerHTML=
   '<div class="drow"><img class="dcover" referrerpolicy="no-referrer" src="'+esc(cover)+'" alt=""><div><h1>'+esc(title)+'</h1><div class="meta">'+[d.year,d.status,eps.length?eps.length+' episodios':''].filter(Boolean).map(esc).join(' · ')+'</div></div></div>'
   +'<div class="chips">'+(d.genres||[]).map(g=>'<span>'+esc(g)+'</span>').join('')+'</div>'
   +'<div class="acts">'+(eps.length?'<button class="btn" id="dGo">'+(started?'Continuar':'Ver')+' ep. '+esc(eps[nextI].number||nextI+1)+'</button>':'')
   +'<button class="btn ghost" id="dFav">'+(isFav(m.id,url)?'★ En mi lista':'☆ Favorito')+'</button></div>'
   +'<p class="desc" id="dDesc">'+esc(strip(d.description)||'Sin descripción.')+'</p>'
   +'<div class="eh"><h3>Episodios</h3><button class="sm" id="dOrd">Invertir orden</button></div><div class="eps" id="eps"></div>';
  drawEps();
  $('#dDesc').onclick=e=>e.currentTarget.classList.toggle('open');
  const item={mod:m.id,url,title,cover};
  $('#dFav').onclick=e=>{toggleFav(item);e.target.textContent=isFav(m.id,url)?'★ En mi lista':'☆ Favorito'};
  if(eps.length)$('#dGo').onclick=()=>playFrom(nextI);
  $('#dOrd').onclick=()=>{D.rev=!D.rev;drawEps()};
}
function drawEps(){
  const {m,d,rev}=D,eps=d.episodes||[];
  let idx=eps.map((_,i)=>i);if(rev)idx.reverse();
  $('#eps').innerHTML=idx.map(i=>{
    const e=eps[i],p=PROG[epKey(m,e)]||{},pc=p.done?100:(p.d?Math.min(100,p.t/p.d*100):0);
    return '<button class="ep'+(viewed(p)?' viewed':'')+'" data-i="'+i+'"><span class="n">'+esc(e.number||i+1)+'</span><span class="t">'+esc(e.title||('Episodio '+(i+1)))+'</span><span class="chk" data-chk="'+i+'" role="checkbox" aria-label="Marcar como visto">✓</span>'+(pc&&!viewed(p)?'<span class="bar" style="width:'+pc+'%"></span>':'')+'</button>';
  }).join('')||'<p class="empty">Este módulo no devolvió episodios.</p>';
}
$('#detail').addEventListener('click',e=>{
  const c=e.target.closest('.chk');
  if(c&&D){
    e.stopPropagation();
    const ep=D.d.episodes[+c.dataset.chk],k=epKey(D.m,ep),p=PROG[k];
    if(viewed(p))delete PROG[k];else PROG[k]=Object.assign({},p,{seen:true,done:true});
    saveProg();drawEps();return;
  }
  const b=e.target.closest('.ep');if(b&&D)playFrom(+b.dataset.i)
});
let busyPlay=false;
async function playFrom(i){
  if(busyPlay||!D)return;
  const {m,d,url,hint}=D,title=d.title||hint.title;
  addHist({mod:m.id,url,title,cover:pickCover(d,hint)});
  const cfg={
    title,list:d.episodes,idx:i,pref:null,
    key:k=>epKey(m,d.episodes[k]),
    load:k=>loadVideos(m,d,d.episodes[k])
  };
  busyPlay=true;toast('Buscando servidores…');
  let srcs,res;
  try{res=(await cfg.load(i))||[]}catch(err){busyPlay=false;return toast('Error: '+err.message)}
  busyPlay=false;
  srcs=res.slice();const raw=res.raw||srcs,hidden=res.hidden||0;
  if(!srcs.length)return toast('Este módulo no devolvió servidores para este episodio');
  const go=k=>{
    if(srcs[k].type==='external'){openExt(srcs[k].url);return}
    cfg.pref=srcs[k].pk||null;cfg.pre={i,srcs,k,raw};openPlayer(cfg);
  };
  if(srcs.length===1&&!hidden)return go(0);
  const show=(arr,hid)=>{
    const items=arr.map((s,k)=>({k,label:s.label||('Servidor '+(k+1)),tag:s.tag,flag:s.flag,on:false}));
    if(hid>0)items.push({k:-1,label:'Mostrar todos ('+hid+' ocultos)',on:false});
    openSheet({title:'Elegir servidor',items,multi:false,keep:true,onPick:k=>{
      if(k==null)return;
      if(k===-1){srcs=raw;setTimeout(()=>show(raw,0),60);return}
      go(k)
    }});
  };
  show(srcs,hidden);
}

function openSheet(o){
  const L=$('#shL');
  $('#shT').textContent=o.title;
  const draw=()=>{L.innerHTML=o.items.map((it,i)=>'<button class="sh-row'+(it.on?' on':'')+'" data-i="'+i+'"><span class="rb"></span><span>'+esc(it.label)+'</span>'+(it.tag?'<em class="tag'+(/latino/i.test(it.tag)?' lat':'')+'"><span class="fl">'+esc(it.flag||'')+'</span> '+esc(it.tag)+'</em>':'')+'</button>').join('')||'<p class="empty">Sin opciones.</p>'};
  draw();
  L.onclick=e=>{
    const b=e.target.closest('.sh-row');if(!b)return;
    const it=o.items[+b.dataset.i];
    if(o.multi){it.on=!it.on;draw()}
    else{const was=it.on;o.items.forEach(x=>x.on=false);it.on=o.keep?true:!was;closeSheet();if(o.onPick)o.onPick(it.on?it.k:null)}
  };
  $('#shF').hidden=!o.multi;
  $('#shClear').onclick=()=>{o.items.forEach(x=>x.on=false);draw()};
  $('#shApply').onclick=()=>{closeSheet();if(o.onApply)o.onApply(o.items.filter(x=>x.on).map(x=>x.k))};
  $('#sheet').hidden=false;
}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet .sh-bg').onclick=closeSheet;
$('#shX').onclick=closeSheet;

const _wopen=window.open.bind(window);
window.open=()=>null;
const openExt=u=>{_wopen(u,'_blank')};
let P=null,hls=null,vid=null,hideT=null,seeking=false,lastSave=0,isFs=false,locked=false,curK=-1,hudT=null,unlT=null,cleanT=null;
let bright=LS.get('bri',1),vol=LS.get('vol',1),fitI=LS.get('fit',0);
const FITS=[['contain','Ajustar'],['cover','Rellenar'],['fill','Estirar']];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const IC_PLAY='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>';
const IC_PAUSE='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const guess=u=>/\.m3u8(\?|#|$)/i.test(u)?'hls':/\.(mp4|webm|m4v|mov)(\?|#|$)/i.test(u)?'mp4':'embed';
const setMsg=t=>{$('#pMsg').textContent=t||''};
function setPlayIcon(p){$('#pPlay').innerHTML=p?IC_PLAY:IC_PAUSE}
function updBars(){$('#bBri').style.height=clamp((bright-0.2)/1.4*100,0,100)+'%';$('#bVol').style.height=Math.round(vol*100)+'%'}
function applyFit(){
  const mode=FITS[fitI][0];
  $('#pFit').textContent='Escala: '+FITS[fitI][1];
  if(vid)vid.style.objectFit=mode;
  const f=$('#vbox iframe');
  if(!f)return;
  const st=$('#stage'),W=st.clientWidth,H=st.clientHeight;
  if(mode==='contain'||W<50||H<50){f.removeAttribute('style');return}
  const r=(W/H)/(16/9),s=f.style;
  if(r>=1){
    const Wi=H*16/9;
    s.width=Wi+'px';s.height=H+'px';s.left=((W-Wi)/2)+'px';s.right='auto';s.top='0';s.bottom='auto';
    s.transformOrigin=mode==='cover'?'center bottom':'center center';
    s.transform=mode==='cover'?'scale('+r+')':'scale('+r+',1)';
  }else{
    const Hi=W*9/16;
    s.width=W+'px';s.height=Hi+'px';s.left='0';s.right='auto';s.top=((H-Hi)/2)+'px';s.bottom='auto';
    s.transformOrigin='center center';
    s.transform=mode==='cover'?'scale('+(1/r)+')':'scale(1,'+(1/r)+')';
  }
}
window.addEventListener('resize',()=>{if(P)applyFit()});
function applyBright(){if(vid)vid.style.filter=bright===1?'':'brightness('+bright+')';updBars()}
function hideOverlay(){if($('#vbox iframe')&&$('#sheet').hidden){$('#stage').classList.add('clean');$('#stage').focus()}}
function armClean(ms){clearTimeout(cleanT);cleanT=setTimeout(hideOverlay,ms||3000)}
function hud(t){const e=$('#hud');e.textContent=t;e.classList.add('on');clearTimeout(hudT)}
function hideHud(ms){clearTimeout(hudT);hudT=setTimeout(()=>$('#hud').classList.remove('on'),ms||500)}
async function setFs(on){
  isFs=on;
  const C=window.Capacitor&&Capacitor.Plugins;if(!C)return;
  try{if(C.Immersive){if(on)await C.Immersive.enter();else await C.Immersive.exit()}}catch(e){}
  try{if(C.ScreenOrientation){if(on)await C.ScreenOrientation.lock({orientation:'landscape'});else await C.ScreenOrientation.unlock()}}catch(e){}
}
function openPlayer(cfg){
  P=cfg;locked=false;$('#pUnlock').hidden=true;
  $('#player').hidden=false;
  if(stack[stack.length-1]!=='player')pushOv('player');
  setFs(true);applyFit();updBars();setPlayIcon(true);
  $('#stage').classList.add('show');
  loadEp(cfg.idx);
}
async function loadEp(i){
  P.idx=i;const ep=P.list[i];
  if(ep.number){$('#pT1').textContent='Capítulo '+ep.number;$('#pT2').textContent=P.title}
  else{$('#pT1').textContent=P.title;$('#pT2').textContent=(ep.title&&ep.title!==P.title)?ep.title:''}
  cleanupVideo();setMsg('Buscando fuentes…');
  $('#stage').classList.add('novid');
  let srcs,pick=-1,rawAll=null;
  if(P.pre&&P.pre.i===i){srcs=P.pre.srcs;pick=P.pre.k;rawAll=P.pre.raw||null;P.pre=null}
  else{
    let res;
    try{res=(await P.load(i))||[]}catch(err){if(P&&P.idx===i)setMsg('Error: '+err.message);return}
    if(!P||P.idx!==i)return;
    srcs=res.slice();rawAll=res.raw||null;
  }
  P.srcs=srcs;P.rawAll=rawAll;curK=-1;
  if(P.key)markSeen(P.key(i));
  if(pick<0){
    const byPref=P.pref?srcs.findIndex(s=>s.pk===P.pref&&s.type!=='external'):-1;
    pick=byPref>=0?byPref:srcs.findIndex(s=>s.type!=='external');
  }
  if(pick<0){setMsg(srcs.length?'Estas fuentes se abren fuera de la app. Elige otra en Servidor.':'Este módulo no devolvió fuentes de video para este episodio.');return}
  pickSrc(pick);
}
function pickSrc(k){
  const s=P.srcs[k];
  if(s.type==='external'){openExt(s.url);return}
  curK=k;startSource(s);
}
function cleanupVideo(){
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  if(vid){try{vid.pause();vid.removeAttribute('src');vid.load()}catch(e){}}
  vid=null;$('#vbox').innerHTML='';clearTimeout(cleanT);$('#stage').classList.remove('clean');
}
function startSource(s){
  cleanupVideo();setMsg('');
  const box=$('#vbox'),stage=$('#stage');
  if(s.type==='embed'){
    stage.classList.add('novid');
    box.innerHTML='<iframe src="'+esc(s.url)+'" referrerpolicy="no-referrer-when-downgrade" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    applyFit();armClean();
    return;
  }
  stage.classList.remove('novid');stage.classList.add('show');
  const v=document.createElement('video');
  v.setAttribute('playsinline','');v.preload='auto';box.appendChild(v);vid=v;
  applyFit();applyBright();v.volume=vol;
  if(s.type==='hls'&&window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:30});
    hls.loadSource(s.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(ev,data)=>{if(data.fatal)setMsg('No se pudo reproducir (HLS: '+data.type+' / '+data.details+(data.response?' / HTTP '+data.response.code:'')+')')});
  }else v.src=s.url;
  const key=P.key?P.key(P.idx):null;
  v.addEventListener('loadedmetadata',()=>{
    $('#pDur').textContent=fmt(v.duration);
    const p=key&&PROG[key];if(p&&p.t>5&&p.d&&p.t<p.d-15)v.currentTime=p.t;
  });
  v.addEventListener('timeupdate',()=>{
    if(!seeking&&v.duration)$('#pSeek').value=v.currentTime/v.duration*1000;
    $('#pCur').textContent=fmt(v.currentTime);
    if(key&&v.duration&&Date.now()-lastSave>4000){lastSave=Date.now();PROG[key]={t:v.currentTime,d:v.duration,done:v.currentTime>v.duration*.92};saveProg()}
  });
  v.addEventListener('play',()=>{setPlayIcon(false);armHide()});
  v.addEventListener('pause',()=>{setPlayIcon(true);stage.classList.add('show')});
  v.addEventListener('waiting',()=>setMsg('Cargando…'));
  v.addEventListener('playing',()=>setMsg(''));
  v.addEventListener('error',()=>{const c=v.error?v.error.code:0;setMsg('No se pudo reproducir (código '+c+')')});
  v.addEventListener('ended',()=>{
    if(key){PROG[key]={t:v.duration,d:v.duration,done:true};saveProg()}
    if(P.idx<P.list.length-1)loadEp(P.idx+1);
  });
  v.play().catch(()=>{});
}
function armHide(){
  clearTimeout(hideT);
  hideT=setTimeout(()=>{if(vid&&!vid.paused)$('#stage').classList.remove('show')},3500);
}
function closePlayerUI(){
  if(vid&&P&&P.key&&vid.duration){const k=P.key(P.idx);PROG[k]={t:vid.currentTime,d:vid.duration,done:vid.currentTime>vid.duration*.92};saveProg()}
  setFs(false);cleanupVideo();closeSheet();
  locked=false;$('#pUnlock').hidden=true;
  $('#player').hidden=true;P=null;
  if(D&&!$('#detail').hidden)drawEps();
}

const stg=$('#stage');
$('#pBack').onclick=()=>history.back();
$('#pPlay').onclick=()=>{if(vid){if(vid.paused)vid.play();else vid.pause()}};
$('#pRw').onclick=()=>{if(vid){vid.currentTime=Math.max(0,vid.currentTime-10);armHide()}};
$('#pFw').onclick=()=>{if(vid){vid.currentTime=Math.min(vid.duration||1e9,vid.currentTime+10);armHide()}};
$('#pSkip').onclick=()=>{if(vid){vid.currentTime=Math.min(vid.duration||1e9,vid.currentTime+90);hud('+90 s');hideHud(700)}};
$('#pSeek').addEventListener('input',e=>{seeking=true;if(vid&&vid.duration)$('#pCur').textContent=fmt(e.target.value/1000*vid.duration)});
$('#pSeek').addEventListener('change',e=>{if(vid&&vid.duration)vid.currentTime=e.target.value/1000*vid.duration;seeking=false;armHide()});
const SPEEDS=[1,1.25,1.5,2,0.75];
$('#pSpd').onclick=e=>{if(!vid)return;const n=SPEEDS[(SPEEDS.indexOf(vid.playbackRate)+1)%SPEEDS.length];vid.playbackRate=n;e.target.textContent=n+'x'};
$('#pFit').onclick=()=>{fitI=(fitI+1)%FITS.length;LS.set('fit',fitI);applyFit();hud(FITS[fitI][1]);hideHud(700)};
$('#pLock').onclick=()=>{locked=true;stg.classList.remove('show');hud('🔒 Bloqueado');hideHud(900)};
$('#pUnlock').onclick=()=>{locked=false;$('#pUnlock').hidden=true;stg.classList.add('show');armHide()};
$('#pEps').onclick=()=>{
  if(!P)return;
  openSheet({title:'Episodios',items:P.list.map((e,i)=>({k:i,label:(e.number?e.number+'. ':'')+(e.title||('Episodio '+(i+1))),on:i===P.idx})),multi:false,keep:true,onPick:k=>{if(k!=null&&k!==P.idx)loadEp(k)}});
};
$('#pQ').onclick=()=>{
  if(!P||!P.srcs||!P.srcs.length)return toast('Aún no hay fuentes');
  const items=P.srcs.map((s,k)=>({k,label:s.label||('Servidor '+(k+1)),tag:s.tag,flag:s.flag,on:k===curK}));
  const extra=P.rawAll?P.rawAll.length-P.srcs.length:0;
  if(extra>0)items.push({k:-1,label:'Mostrar todos ('+extra+' ocultos)',on:false});
  openSheet({title:'Servidor',items,multi:false,keep:true,onPick:k=>{
    if(k==null)return;
    if(k===-1){P.srcs=P.rawAll;P.rawAll=null;setTimeout(()=>$('#pQ').click(),80);return}
    P.pref=P.srcs[k].pk||null;pickSrc(k)
  }});
};

$('#pReveal').onclick=()=>{$('#stage').classList.remove('clean');$('#stage').focus();armClean(4000)};
window.addEventListener('blur',()=>{
  setTimeout(()=>{
    const a=document.activeElement;
    if(P&&a&&a.tagName==='IFRAME'){$('#stage').classList.remove('clean');armClean(4000)}
  },0);
});

let G=null,tapT=0,tapTimer=null;
stg.addEventListener('touchstart',e=>{
  if(!vid||e.target.closest('button,input'))return;
  const t=e.touches[0],r=stg.getBoundingClientRect();
  G={x:t.clientX,y:t.clientY,side:(t.clientX-r.left)<r.width/2?'L':'R',mode:null,sv:vid.volume,sb:bright,st:vid.currentTime,w:r.width,h:r.height,target:null};
},{passive:true});
stg.addEventListener('touchmove',e=>{
  if(!G||!vid||locked)return;
  const t=e.touches[0],dx=t.clientX-G.x,dy=t.clientY-G.y;
  if(!G.mode){
    if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
    G.mode=Math.abs(dx)>Math.abs(dy)?'seek':(G.side==='L'?'bri':'vol');
  }
  e.preventDefault();
  if(G.mode==='seek'&&vid.duration){
    const d=dx/G.w*Math.min(240,vid.duration);
    G.target=clamp(G.st+d,0,vid.duration);
    hud((d>=0?'+':'-')+Math.abs(Math.round(d))+' s · '+fmt(G.target));
  }else if(G.mode==='bri'){
    bright=clamp(G.sb-dy/G.h*1.4,0.2,1.6);applyBright();hud('☀ '+Math.round(bright*100)+'%');
  }else if(G.mode==='vol'){
    vol=clamp(G.sv-dy/G.h*1.4,0,1);vid.volume=vol;updBars();hud('🔊 '+Math.round(vol*100)+'%');
  }
},{passive:false});
stg.addEventListener('touchend',()=>{
  if(!G)return;const g=G;G=null;
  if(locked){$('#pUnlock').hidden=false;clearTimeout(unlT);unlT=setTimeout(()=>{$('#pUnlock').hidden=true},2500);return}
  if(g.mode){
    if(g.mode==='seek'&&vid&&g.target!=null)vid.currentTime=g.target;
    if(g.mode==='bri')LS.set('bri',bright);
    if(g.mode==='vol')LS.set('vol',vol);
    hideHud();return;
  }
  const now=Date.now();
  if(vid&&now-tapT<300){
    clearTimeout(tapTimer);tapT=0;
    vid.currentTime=clamp(vid.currentTime+(g.side==='L'?-10:10),0,vid.duration||1e9);
    hud(g.side==='L'?'↺ -10 s':'+10 s ↻');hideHud(600);return;
  }
  tapT=now;
  tapTimer=setTimeout(()=>{tapT=0;stg.classList.toggle('show');if(stg.classList.contains('show'))armHide()},300);
});

loadMods();
setTab('home');

try{
  const AppP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  if(AppP&&AppP.addListener){
    AppP.addListener('backButton',()=>{
      if(!$('#mpick').hidden)closeModPick();
      else if(!$('#sheet').hidden)closeSheet();
      else if(stack.length)history.back();
      else if(tab!=='home')setTab('home');
      else AppP.exitApp();
    });
  }
}catch(e){}
</script>
</body>
