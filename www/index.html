<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14121f">
<title>AnimeHub</title>
<style>
:root{--bg:#14121f;--card:#1e1b2e;--card2:#2a2640;--tx:#efeaf7;--mut:#8f89a8;--ac:#ff7a9c;--ok:#7be0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h3{margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo span{color:var(--ac)}
#modSel{margin-left:auto;background:var(--card);border:1px solid #ffffff14;border-radius:999px;padding:8px 12px;font-size:13px;max-width:58%}
#main{flex:1;overflow-y:auto;padding:6px 14px 96px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#100e1a;border-top:1px solid #ffffff10;padding-bottom:env(safe-area-inset-bottom);z-index:5}
#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button i{font-style:normal;font-size:20px;line-height:1}
#tabs button.on{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0}
.poster{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ct{font-size:12.5px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:11px;color:var(--mut);margin-top:2px}
.sk{aspect-ratio:2/3;border-radius:10px;background:var(--card);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.empty{color:var(--mut);text-align:center;padding:36px 12px;line-height:1.5}
.btn{display:block;width:100%;background:var(--ac);color:#1b0a10;font-weight:700;border:0;border-radius:12px;padding:13px;margin:10px 0}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.more{background:var(--card2);color:var(--tx);margin:18px 0}
.sm{background:var(--card2);border:0;border-radius:9px;padding:7px 11px;font-size:12px}
.sm.del{color:var(--ac)}
input,textarea,select{background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:12px;width:100%}
textarea{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sbar{display:flex;gap:8px;margin:6px 0 16px}
.sbar button{background:var(--ac);color:#1b0a10;font-weight:700;border:0;border-radius:12px;padding:0 16px}
main h3,#detail h3{font-size:15px;margin:22px 0 10px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.mrow>div{flex:1;min-width:0}
.mrow small{display:block;color:var(--mut);margin-top:2px;font-size:11px}
.tag{font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:3px 8px}
.note{color:var(--mut);font-size:12px;line-height:1.5}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:24px;line-height:1}
.dhead{height:250px;background-size:cover;background-position:center;position:relative}
.dhead::after{content:"";position:absolute;inset:0;background:linear-gradient(#14121f55,var(--bg))}
.dbody{position:relative;z-index:2;margin-top:-100px;padding:0 16px 48px}
.drow{display:flex;gap:14px;align-items:flex-end}
.dcover{width:108px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--card)}
.drow h1{font-size:19px;line-height:1.25}
.meta{color:var(--mut);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chips span,.chips button{background:var(--card2);border:0;border-radius:999px;padding:5px 11px;font-size:12px}
.chips button.on{background:var(--ac);color:#1b0a10;font-weight:700}
.acts{display:flex;gap:8px}
.acts .btn{margin:12px 0 4px}
.desc{white-space:pre-line;line-height:1.55;font-size:14px;color:#cfc8e2;max-height:6.2em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.eh{display:flex;align-items:center;justify-content:space-between}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:12px;padding:10px 12px;color:inherit;text-align:left;position:relative;overflow:hidden;width:100%}
.ep .n{min-width:34px;height:34px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px}
.ep .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.ep.done{opacity:.5}
#player{z-index:20;background:#000;overflow:hidden;--pl:#b9c6ff}
#stage{position:absolute;inset:0;background:#000;user-select:none;touch-action:none}
#vbox,#vbox video,#vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#vbox video{object-fit:contain}
#ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#000c,#0000 30%,#0000 55%,#000d);opacity:0;pointer-events:none;transition:opacity .2s;color:var(--pl);padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#stage.show #ctl{opacity:1;pointer-events:auto}
#ctl button{background:none;border:0;color:var(--pl)}
.ctop{display:flex;align-items:flex-start;gap:12px}
#pBack{font-size:28px;line-height:1;color:#fff!important;padding:2px 8px}
#pTitle{flex:1;min-width:0;text-align:center;line-height:1.3;color:#e6e9f5}
#pT1{display:block;font-size:17px;font-weight:700}
#pT2{display:block;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1.5px solid #ffffff44!important;border-radius:999px;padding:11px 18px!important;font-size:14px;font-weight:700;background:#0005!important}
.side{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;pointer-events:none}
.side.L{left:max(14px,env(safe-area-inset-left))}
.side.R{right:max(14px,env(safe-area-inset-right))}
.vbar{width:14px;height:34vh;background:#ffffff26;border-radius:8px;overflow:hidden;position:relative}
.vbar i{position:absolute;left:0;right:0;bottom:0;background:var(--pl);border-radius:8px}
.cmid{display:flex;justify-content:center;align-items:center;gap:clamp(24px,10vw,90px)}
.cmid button{font-size:20px;font-weight:700;padding:10px}
#pPlay{width:84px;height:84px;display:grid;place-items:center;padding:0}
#pPlay svg{width:68px;height:68px}
.cbot{display:flex;flex-direction:column;gap:4px}
.seek{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
#pSeek{flex:1;height:26px;background:none;border:0;padding:0;accent-color:var(--pl)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tools button{font-size:14px;font-weight:700;padding:8px 6px}
#stage.novid #ctl{opacity:1;pointer-events:none;background:none}
#stage.novid .side,#stage.novid .cmid,#stage.novid .seek,#stage.novid #pLock,#stage.novid #pFit,#stage.novid #pSpd,#stage.novid #pSkip,#stage.novid #pTitle{display:none}
#stage.novid #pBack{pointer-events:auto;background:#0008!important;border-radius:50%;width:42px;height:42px;padding:0}
#stage.novid .cbot{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
#stage.novid .tools{pointer-events:auto;gap:8px}
#stage.novid .tools button{background:#0008!important;border-radius:999px;padding:8px 12px}
#pUnlock{position:absolute;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);background:#000a;border:0;color:#fff;border-radius:50%;width:52px;height:52px;font-size:22px}
#pMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:14px;color:#ddd;pointer-events:none}
#hud{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:#000b;color:#fff;font-size:15px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
#hud.on{opacity:1}
.frow{display:flex;gap:8px;overflow-x:auto;margin:-6px 0 14px;padding-bottom:4px}
.fchip{flex:none;background:none;border:1.5px solid #ffffff2e;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.fchip.on{border-color:var(--ac);color:var(--ac)}
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:#0009}
.sh-box{position:relative;width:min(94vw,460px);max-height:84vh;background:var(--card);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media(orientation:landscape){#sheet{align-items:center}.sh-box{border-radius:18px;max-height:90vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:16px}
#shX{background:none;border:0;font-size:20px;padding:4px 8px}
#shL{overflow-y:auto;padding:0 6px}
.sh-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:13px 12px;font-size:15px;text-align:left}
.sh-row .rb{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:none}
.sh-row.on .rb{border-color:var(--ac);background:radial-gradient(var(--ac) 45%,transparent 50%)}
#shF{display:flex;gap:8px;padding:10px 12px}
#shF button{flex:1;margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="top"><div class="logo">Anime<span>Hub</span></div><select id="modSel" aria-label="Módulo activo"></select></header>
  <main id="main"></main>
  <nav id="tabs">
    <button data-t="home"><i>⌂</i>Inicio</button>
    <button data-t="search"><i>⌕</i>Buscar</button>
    <button data-t="favs"><i>★</i>Mi lista</button>
    <button data-t="mods"><i>⚙</i>Módulos</button>
  </nav>
</div>

<section id="detail" class="ov" hidden></section>

<section id="player" class="ov" hidden>
  <div id="stage">
    <div id="vbox"></div>
    <div id="ctl">
      <div class="ctop">
        <button id="pBack" aria-label="Volver">←</button>
        <div id="pTitle"><span id="pT1"></span><span id="pT2"></span></div>
        <button id="pSkip" class="pill">Omitir opening</button>
      </div>
      <div class="side L"><div class="vbar"><i id="bBri"></i></div><span>☀</span></div>
      <div class="side R"><div class="vbar"><i id="bVol"></i></div><span>🔊</span></div>
      <div class="cmid"><button id="pRw" aria-label="Atrasar 10 segundos">↺ 10</button><button id="pPlay" aria-label="Reproducir o pausar"></button><button id="pFw" aria-label="Adelantar 10 segundos">10 ↻</button></div>
      <div class="cbot">
        <div class="seek"><span id="pCur">0:00</span><input type="range" id="pSeek" min="0" max="1000" value="0"><span id="pDur">0:00</span></div>
        <div class="tools"><button id="pFit">Escala: Ajustar</button><button id="pLock">Bloquear</button><button id="pEps">Episodios</button><button id="pQ">Calidad</button><button id="pSpd">1x</button></div>
      </div>
    </div>
    <button id="pUnlock" hidden aria-label="Desbloquear">🔓</button>
    <div id="pMsg"></div>
    <div id="hud"></div>
  </div>
</section>

<div id="sheet" hidden>
  <div class="sh-bg"></div>
  <div class="sh-box">
    <div class="sh-h"><b id="shT"></b><button id="shX" aria-label="Cerrar">✕</button></div>
    <div id="shL"></div>
    <div id="shF"><button class="btn ghost" id="shClear">Limpiar</button><button class="btn" id="shApply">Aplicar</button></div>
  </div>
</div>

<div id="toast"></div>

<script src="hls.min.js"></script>
<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=h=>new DOMParser().parseFromString(String(h||'').replace(/<br\s*\/?>/gi,'\n'),'text/html').body.textContent.trim();
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=s=>{if(!isFinite(s)||s<0)return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
let toastT;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}

/* ============ API que reciben los módulos ============ */
const api={
  async text(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()},
  async json(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
  async html(url,opt){return new DOMParser().parseFromString(await api.text(url,opt),'text/html')},
  abs(rel,base){try{return new URL(rel,base).href}catch(e){return rel}}
};

/* ============ módulo incluido: AniList (catálogo oficial) ============ */
const ANI='https://graphql.anilist.co';
async function aniQ(query,variables){
  const r=await fetch(ANI,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables})});
  const j=await r.json();if(j.errors)throw new Error(j.errors[0].message);return j.data;
}
const F='id title{romaji english} coverImage{extraLarge large} seasonYear format';
const mapM=m=>({title:m.title.english||m.title.romaji,cover:m.coverImage.extraLarge||m.coverImage.large,url:String(m.id),sub:[m.format,m.seasonYear].filter(Boolean).join(' · ')});
const GENRES=[['Action','Acción'],['tag:Martial Arts','Artes Marciales'],['tag:Cars','Autos'],['Adventure','Aventura'],['tag:School','Colegial'],['Comedy','Comedia'],['Slice of Life','Cosas de la vida'],['tag:Demons','Demonios'],['Drama','Drama'],['Fantasy','Fantasía'],['tag:Isekai','Isekai'],['Horror','Terror'],['Mahou Shoujo','Magia (Mahou Shoujo)'],['Mecha','Mecha'],['Music','Música'],['Mystery','Misterio'],['tag:Military','Militar'],['Psychological','Psicológico'],['Romance','Romance'],['Sci-Fi','Ciencia ficción'],['tag:Super Power','Superpoderes'],['Sports','Deportes'],['Supernatural','Sobrenatural'],['Thriller','Suspenso'],['tag:Vampire','Vampiros']].sort((a,b)=>a[1].localeCompare(b[1],'es'));
const BUILTIN_FILTERS=[
  {id:'genre',label:'Género',options:GENRES.map(g=>({v:g[0],t:g[1]}))},
  {id:'type',label:'Tipo',options:[{v:'TV',t:'TV'},{v:'MOVIE',t:'Película'},{v:'OVA',t:'OVA'},{v:'ONA',t:'ONA'},{v:'SPECIAL',t:'Especial'}]},
  {id:'status',label:'Estado',options:[{v:'RELEASING',t:'En emisión'},{v:'FINISHED',t:'Finalizado'},{v:'NOT_YET_RELEASED',t:'Próximamente'}]}
];
const BUILTIN={
  id:'anilist',name:'AniList (catálogo)',version:1,builtin:true,filters:BUILTIN_FILTERS,
  async home(p){const d=await aniQ('query($p:Int){Page(page:$p,perPage:24){media(type:ANIME,sort:TRENDING_DESC,isAdult:false){'+F+'}}}',{p:p||1});return d.Page.media.map(mapM)},
  async search(q,p,f){
    f=f||{};const g=f.genre||[];
    const genres=g.filter(x=>x.indexOf('tag:')!==0),tags=g.filter(x=>x.indexOf('tag:')===0).map(x=>x.slice(4));
    const d=await aniQ('query($p:Int,$s:String,$g:[String],$t:[String],$f:[MediaFormat],$st:[MediaStatus],$so:[MediaSort]){Page(page:$p,perPage:24){media(type:ANIME,search:$s,genre_in:$g,tag_in:$t,format_in:$f,status_in:$st,sort:$so,isAdult:false){'+F+'}}}',
      {p:p||1,s:q||null,g:genres.length?genres:null,t:tags.length?tags:null,f:(f.type&&f.type.length)?f.type:null,st:(f.status&&f.status.length)?f.status:null,so:[q?'SEARCH_MATCH':'POPULARITY_DESC']});
    return d.Page.media.map(mapM);
  },
  async details(url){
    const d=await aniQ('query($id:Int){Media(id:$id){id title{romaji english} coverImage{extraLarge} bannerImage description genres seasonYear status episodes nextAiringEpisode{episode} trailer{id site} streamingEpisodes{title thumbnail url site}}}',{id:+url});
    const m=d.Media,se=m.streamingEpisodes||[];let eps;
    if(se.length)eps=se.map((e,i)=>({number:i+1,title:e.title,url:e.url}));
    else{const n=m.episodes||(m.nextAiringEpisode?m.nextAiringEpisode.episode-1:0);eps=Array.from({length:n},(_,i)=>({number:i+1,title:'Episodio '+(i+1),url:'ani:'+m.id+':'+(i+1)}))}
    return{title:m.title.english||m.title.romaji,cover:m.coverImage.extraLarge,banner:m.bannerImage,description:m.description,genres:m.genres,year:m.seasonYear,status:m.status,episodes:eps,trailer:m.trailer&&m.trailer.site==='youtube'?m.trailer.id:null};
  },
  async videos(url,ctx){
    const out=[];
    if(/^https?:/.test(url))out.push({label:'Ver en la plataforma oficial',url,type:'external'});
    if(ctx&&ctx.detail&&ctx.detail.trailer)out.push({label:'Tráiler',url:'https://www.youtube.com/embed/'+ctx.detail.trailer,type:'embed'});
    return out;
  }
};

/* ============ plantilla que se copia para pedirle módulos a otra IA ============ */
const TEMPLATE=`// MÓDULO PARA AnimeHub
// Es un archivo JavaScript. Debe terminar con "return { ... }".
// Dentro tienes disponible el objeto "api":
//   await api.json(url, opciones)   -> objeto JSON (sin problemas de CORS)
//   await api.text(url, opciones)   -> texto
//   await api.html(url, opciones)   -> Document (usa querySelector / querySelectorAll)
//   api.abs(rutaRelativa, base)     -> URL absoluta
// Las listas de anime usan este formato: { title, cover, url, sub }
//   url = lo que necesites para luego pedir los detalles (id o enlace)
return {
  id: 'mi-modulo',            // único, sin espacios
  name: 'Mi módulo',          // nombre visible en la app
  version: 1,

  // Pantalla de inicio (page empieza en 1). Opcional.
  async home(page) {
    return [{ title: 'Nombre', cover: 'https://.../portada.jpg', url: 'id-o-enlace', sub: 'TV · 2024' }];
  },

  // Filtros opcionales para la pestaña Buscar (género, tipo, estado...). Quita esta línea si no los necesitas.
  filters: [{ id: 'genre', label: 'Género', options: [{ v: 'accion', t: 'Acción' }, { v: 'comedia', t: 'Comedia' }] }],

  // Búsqueda. filters trae lo elegido, por ejemplo { genre: ['accion'] }. query puede venir vacío.
  async search(query, page, filters) {
    return [{ title: 'Nombre', cover: 'https://.../portada.jpg', url: 'id-o-enlace' }];
  },

  // Ficha del anime: descripción y lista de episodios
  async details(url) {
    return {
      title: 'Nombre', cover: 'https://...', banner: 'https://... (opcional)',
      description: 'Sinopsis', genres: ['Acción'], year: 2024, status: 'En emisión',
      episodes: [{ number: 1, title: 'Episodio 1', url: 'id-o-enlace-del-episodio' }]
    };
  },

  // Fuentes de video de un episodio
  // type: 'hls' (.m3u8) | 'mp4' | 'embed' (iframe) | 'external' (se abre fuera de la app)
  async videos(episodeUrl, ctx) {
    return [{ label: 'HD', url: 'https://.../video.m3u8', type: 'hls' }];
  }
};`;

/* ============ gestión de módulos ============ */
function compile(code){
  const module={exports:{}};
  const r=new Function('api','module','exports',code)(api,module,module.exports);
  const m=r||module.exports;
  if(!m||!m.id||!m.name)throw new Error('El módulo necesita "id" y "name".');

let homeSt={mod:null};
async function rHome(){
  const m=cur();

async function loadHome(){
  const st=homeSt,m=cur();
  if(st.loading)return;st.loading=true;
  try{
    const p=st.page+1;
    const r=(typeof m.home==='function'?await m.home(p):await m.search('',p))||[];
    if(st!==homeSt)return;

    st.items.push(...r.map(x=>Object.assign({},x,{mod:m.id})));

function rSearch(){
  const m=cur(),fl=m.filters||[];
  $('#main').innerHTML='<form id="sf" class="sbar"><input id="sq" type="search" placeholder="Buscar en '+esc(m.name)+'" enterkeyhint="search"><button>Buscar</button></form>'
    +(fl.length?'<div class="frow">'+fl.map(f=>'<button type="button" class="fchip'+(nSel(f.id)?' on':'')+'" data-f="'+esc(f.id)+'">'+esc(f.label)+' ('+nSel(f.id)+') ▾</button>').join('')+'</div>':'')

function openFilter(id){
  const m=cur(),f=(m.filters||[]).find(x=>x.id===id);if(!f)return;
  const sel=SF[id]||[];
  const items=f.options.map(o=>({k:o.v,label:o.t,on:sel.indexOf(o.v)>=0}));
  const done=keys=>{S.q=$('#sq')?$('#sq').value.trim():S.q;SF[id]=keys;rSearch();doSearch(1)};
  openSheet({title:f.label,items,multi:f.multi!==false,onApply:done,onPick:k=>done(k==null?[]:[k])});
}
async function doSearch(p){
  const m=cur();
  if(p===1){
    const q=$('#sq')?$('#sq').value.trim():S.q;
    if(!q&&!anyFilter())return toast('Escribe un nombre o elige filtros');
    S={q,items:[],page:0,done:false,err:''};
    if($('#sres'))$('#sres').innerHTML=skeleton();
  }
  try{
    const r=(await m.search(S.q,p,SF))||[];
    S.page=p;if(!r.length)S.done=true;
    S.items.push(...r.map(x=>Object.assign({},x,{mod:m.id})));
  }catch(e){S.err=e.message;S.done=true}
  if(tab==='search')drawSearch();
}
function drawSearch(){
  const box=$('#sres');if(!box)return;
  const has=S.q||anyFilter();
  box.innerHTML=(S.items.length?grid(S.items):'')
    +(S.err?'<p class="empty">No se pudo buscar: '+esc(S.err)+'</p>':'')
    +(has&&!S.items.length&&!S.err?'<p class="empty">Sin resultados.</p>':'')
    +(!has?'<p class="empty">Escribe el nombre de un anime o elige filtros de género, tipo y estado.</p>':'')
    +(has&&!S.done&&S.items.length?'<button class="btn more" id="smore">Cargar más</button>':'');
  const b=$('#smore');if(b)b.onclick=()=>{b.textContent='Cargando…';doSearch(S.page+1)};
}

function setHead(u){if(u)$('#dHead').style.backgroundImage='url("'+String(u).replace(/"/g,'%22')+'")'}

   '<div class="drow"><img class="dcover" src="'+esc(cover)+'" alt=""><div><h1>'+esc(title)+'</h1><div class="meta">'+[d.year,d.status,eps.length?eps.length+' episodios':''].filter(Boolean).map(esc).join(' · ')+'</div></div></div>'
   +'<div class="chips">'+(d.genres||[]).map(g=>'<span>'+esc(g)+'</span>').join('')+'</div>'

/* ============ reproductor interno ============ */
/* Ninguna página ni módulo puede abrir ventanas nuevas; solo la app, cuando tú eliges una fuente externa. */
const _wopen=window.open.bind(window);
window.open=()=>null;
const openExt=u=>{_wopen(u,'_blank')};
let P=null,hls=null,vid=null,hideT=null,seeking=false,lastSave=0,isFs=false,locked=false,curK=-1,hudT=null,unlT=null;
let bright=LS.get('bri',1),vol=LS.get('vol',1),fitI=LS.get('fit',0);
const FITS=[['contain','Ajustar'],['cover','Rellenar'],['fill','Estirar']];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const IC_PLAY='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>';
const IC_PAUSE='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const guess=u=>/\.m3u8(\?|#|$)/i.test(u)?'hls':/\.(mp4|webm|m4v|mov)(\?|#|$)/i.test(u)?'mp4':'embed';
const setMsg=t=>{$('#pMsg').textContent=t||''};
function setPlayIcon(p){$('#pPlay').innerHTML=p?IC_PLAY:IC_PAUSE}
function updBars(){$('#bBri').style.height=clamp((bright-0.2)/1.4*100,0,100)+'%';$('#bVol').style.height=Math.round(vol*100)+'%'}
function applyFit(){if(vid)vid.style.objectFit=FITS[fitI][0];$('#pFit').textContent='Escala: '+FITS[fitI][1]}
function applyBright(){if(vid)vid.style.filter=bright===1?'':'brightness('+bright+')';updBars()}
function hud(t){const e=$('#hud');e.textContent=t;e.classList.add('on');clearTimeout(hudT)}
function hideHud(ms){clearTimeout(hudT);hudT=setTimeout(()=>$('#hud').classList.remove('on'),ms||500)}
async function setFs(on){
  isFs=on;
  const C=window.Capacitor&&Capacitor.Plugins;if(!C)return;
  try{if(C.Immersive){if(on)await C.Immersive.enter();else await C.Immersive.exit()}}catch(e){}
  try{if(C.ScreenOrientation){if(on)await C.ScreenOrientation.lock({orientation:'landscape'});else await C.ScreenOrientation.unlock()}}catch(e){}
}
function openPlayer(cfg){
  P=cfg;locked=false;$('#pUnlock').hidden=true;
  $('#player').hidden=false;
  if(stack[stack.length-1]!=='player')pushOv('player');
  setFs(true);applyFit();updBars();setPlayIcon(true);
  $('#stage').classList.add('show');

async function loadEp(i){
  P.idx=i;const ep=P.list[i];
  if(ep.number){$('#pT1').textContent='Capítulo '+ep.number;$('#pT2').textContent=P.title}
  else{$('#pT1').textContent=P.title;$('#pT2').textContent=(ep.title&&ep.title!==P.title)?ep.title:''}
  cleanupVideo();setMsg('Buscando fuentes…');
  $('#stage').classList.add('novid');
  let srcs;
  try{srcs=(await P.load(i))||[]}catch(err){if(P&&P.idx===i)setMsg('Error: '+err.message);return}
  if(!P||P.idx!==i)return;
  srcs=srcs.map(s=>Object.assign({},s,{type:s.type||guess(s.url)}));
  P.srcs=srcs;curK=-1;
  const first=srcs.findIndex(s=>s.type!=='external');
  if(first<0){setMsg(srcs.length?'Estas fuentes se abren fuera de la app. Elige otra en Calidad.':'Este módulo no devolvió fuentes de video para este episodio.');return}
  pickSrc(first);
}
function pickSrc(k){
  const s=P.srcs[k];
  if(s.type==='external'){openExt(s.url);return}
  curK=k;startSource(s);
}
function cleanupVideo(){
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  if(vid){try{vid.pause();vid.removeAttribute('src');vid.load()}catch(e){}}
  vid=null;$('#vbox').innerHTML='';
}
function startSource(s){
  cleanupVideo();setMsg('');
  const box=$('#vbox'),stage=$('#stage');
  if(s.type==='embed'){
    stage.classList.add('novid');
    box.innerHTML='<iframe src="'+esc(s.url)+'" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    return;
  }
  stage.classList.remove('novid');stage.classList.add('show');
  const v=document.createElement('video');
  v.setAttribute('playsinline','');v.preload='auto';box.appendChild(v);vid=v;
  applyFit();applyBright();v.volume=vol;
  if(s.type==='hls'&&window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:30});
    hls.loadSource(s.url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(ev,data)=>{if(data.fatal)setMsg('No se pudo reproducir (HLS: '+data.type+' / '+data.details+(data.response?' / HTTP '+data.response.code:'')+')')});
  }else v.src=s.url;
  const key=P.key?P.key(P.idx):null;
  v.addEventListener('loadedmetadata',()=>{
    $('#pDur').textContent=fmt(v.duration);
    const p=key&&PROG[key];if(p&&p.t>5&&p.d&&p.t<p.d-15)v.currentTime=p.t;
  });
  v.addEventListener('timeupdate',()=>{
    if(!seeking&&v.duration)$('#pSeek').value=v.currentTime/v.duration*1000;
    $('#pCur').textContent=fmt(v.currentTime);
    if(key&&v.duration&&Date.now()-lastSave>4000){lastSave=Date.now();PROG[key]={t:v.currentTime,d:v.duration,done:v.currentTime>v.duration*.92};saveProg()}
  });
  v.addEventListener('play',()=>{setPlayIcon(false);armHide()});
  v.addEventListener('pause',()=>{setPlayIcon(true);stage.classList.add('show')});
  v.addEventListener('waiting',()=>setMsg('Cargando…'));
  v.addEventListener('playing',()=>setMsg(''));
  v.addEventListener('error',()=>{const c=v.error?v.error.code:0;setMsg('No se pudo reproducir (código '+c+(c===2?': red o servidor bloqueado':c===3?': video dañado':c===4?': enlace o formato no válido':'')+')')});
  v.addEventListener('ended',()=>{
    if(key){PROG[key]={t:v.duration,d:v.duration,done:true};saveProg()}
    if(P.idx<P.list.length-1)loadEp(P.idx+1);
  });
  v.play().catch(()=>{});
}
function armHide(){
  clearTimeout(hideT);
  hideT=setTimeout(()=>{if(vid&&!vid.paused)$('#stage').classList.remove('show')},3500);
}
function closePlayerUI(){
  if(vid&&P&&P.key&&vid.duration){const k=P.key(P.idx);PROG[k]={t:vid.currentTime,d:vid.duration,done:vid.currentTime>vid.duration*.92};saveProg()}
  setFs(false);cleanupVideo();closeSheet();
  locked=false;$('#pUnlock').hidden=true;
  $('#player').hidden=true;P=null;
  if(D&&!$('#detail').hidden)drawEps();
}

/* ---- controles ---- */
const stg=$('#stage');
$('#pBack').onclick=()=>history.back();
$('#pPlay').onclick=()=>{if(vid){if(vid.paused)vid.play();else vid.pause()}};
$('#pRw').onclick=()=>{if(vid){vid.currentTime=Math.max(0,vid.currentTime-10);armHide()}};
$('#pFw').onclick=()=>{if(vid){vid.currentTime=Math.min(vid.duration||1e9,vid.currentTime+10);armHide()}};
$('#pSkip').onclick=()=>{if(vid){vid.currentTime=Math.min(vid.duration||1e9,vid.currentTime+85);hud('+85 s');hideHud(700)}};
$('#pSeek').addEventListener('input',e=>{seeking=true;if(vid&&vid.duration)$('#pCur').textContent=fmt(e.target.value/1000*vid.duration)});
$('#pSeek').addEventListener('change',e=>{if(vid&&vid.duration)vid.currentTime=e.target.value/1000*vid.duration;seeking=false;armHide()});
const SPEEDS=[1,1.25,1.5,2,0.75];
$('#pSpd').onclick=e=>{if(!vid)return;const n=SPEEDS[(SPEEDS.indexOf(vid.playbackRate)+1)%SPEEDS.length];vid.playbackRate=n;e.target.textContent=n+'x'};
$('#pFit').onclick=()=>{fitI=(fitI+1)%FITS.length;LS.set('fit',fitI);applyFit();hud(FITS[fitI][1]);hideHud(700)};
$('#pLock').onclick=()=>{locked=true;stg.classList.remove('show');hud('🔒 Bloqueado');hideHud(900)};
$('#pUnlock').onclick=()=>{locked=false;$('#pUnlock').hidden=true;stg.classList.add('show');armHide()};
$('#pEps').onclick=()=>{
  if(!P)return;
  openSheet({title:'Episodios',items:P.list.map((e,i)=>({k:i,label:(e.number?e.number+'. ':'')+(e.title||('Episodio '+(i+1))),on:i===P.idx})),multi:false,keep:true,onPick:k=>{if(k!=null&&k!==P.idx)loadEp(k)}});
};
$('#pQ').onclick=()=>{
  if(!P||!P.srcs||!P.srcs.length)return toast('Aún no hay fuentes');
  openSheet({title:'Calidad / fuente',items:P.srcs.map((s,k)=>({k,label:s.label||('Fuente '+(k+1)),on:k===curK})),multi:false,keep:true,onPick:k=>{if(k!=null)pickSrc(k)}});
};

/* ---- gestos: izquierda=brillo, derecha=volumen, horizontal=adelantar/atrasar, doble toque=±10 s ---- */
let G=null,tapT=0,tapTimer=null;
stg.addEventListener('touchstart',e=>{
  if(!vid||e.target.closest('button,input'))return;
  const t=e.touches[0],r=stg.getBoundingClientRect();
  G={x:t.clientX,y:t.clientY,side:(t.clientX-r.left)<r.width/2?'L':'R',mode:null,sv:vid.volume,sb:bright,st:vid.currentTime,w:r.width,h:r.height,target:null};
},{passive:true});
stg.addEventListener('touchmove',e=>{
  if(!G||!vid||locked)return;
  const t=e.touches[0],dx=t.clientX-G.x,dy=t.clientY-G.y;
  if(!G.mode){
    if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
    G.mode=Math.abs(dx)>Math.abs(dy)?'seek':(G.side==='L'?'bri':'vol');
  }
  e.preventDefault();
  if(G.mode==='seek'&&vid.duration){
    const d=dx/G.w*Math.min(240,vid.duration);
    G.target=clamp(G.st+d,0,vid.duration);
    hud((d>=0?'+':'-')+Math.abs(Math.round(d))+' s · '+fmt(G.target));
  }else if(G.mode==='bri'){
    bright=clamp(G.sb-dy/G.h*1.4,0.2,1.6);applyBright();hud('☀ '+Math.round(bright*100)+'%');
  }else if(G.mode==='vol'){
    vol=clamp(G.sv-dy/G.h*1.4,0,1);vid.volume=vol;updBars();hud('🔊 '+Math.round(vol*100)+'%');
  }
},{passive:false});
stg.addEventListener('touchend',()=>{
  if(!G)return;const g=G;G=null;
  if(locked){$('#pUnlock').hidden=false;clearTimeout(unlT);unlT=setTimeout(()=>{$('#pUnlock').hidden=true},2500);return}
  if(g.mode){
    if(g.mode==='seek'&&vid&&g.target!=null)vid.currentTime=g.target;
    if(g.mode==='bri')LS.set('bri',bright);
    if(g.mode==='vol')LS.set('vol',vol);
    hideHud();return;
  }
  const now=Date.now();
  if(vid&&now-tapT<300){
    clearTimeout(tapTimer);tapT=0;
    vid.currentTime=clamp(vid.currentTime+(g.side==='L'?-10:10),0,vid.duration||1e9);
    hud(g.side==='L'?'↺ -10 s':'+10 s ↻');hideHud(600);return;
  }
  tapT=now;
  tapTimer=setTimeout(()=>{tapT=0;stg.classList.toggle('show');if(stg.classList.contains('show'))armHide()},300);
});

/* ============ inicio ============ */
loadMods();
setTab('home');

/* ============ botón/gesto atrás de Android ============ */
try{
  const AppP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
  if(AppP&&AppP.addListener){
    AppP.addListener('backButton',()=>{
      if(!$('#sheet').hidden)closeSheet();
      else if(stack.length)history.back();
      else if(tab!=='home')setTab('home');
      else AppP.exitApp();
    });
  }
}catch(e){}
</script>
