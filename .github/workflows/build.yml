name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Copiar reproductor HLS
        run: cp node_modules/hls.js/dist/hls.min.js www/hls.min.js

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Permitir enlaces http
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnimeHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeHub-apk
          path: AnimeHub.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AnimeHub build ${{ github.run_number }}
          files: AnimeHub.apk
          
